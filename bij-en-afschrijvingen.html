<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pot.titel">Bij- en afschrijvingen</title>
<script src="i18n/i18n.js"></script>
<script src="i18n/nl.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/da.js"></script>
<script src="config.js"></script>
<script src="config-overlay.js"></script>
<style>
:root{--serie2:#b8741a;--bg:#f6f7f9;--card:#ffffff;--text:#1d2630;--muted:#5b6675;--line:#dfe3e8;--accent:#0a4f9c;--pos:#1b7a3d;--neg:#b3261e;--head:#eef2f7;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--serie2:#f0b44c;--bg:#111820;--card:#18212b;--text:#e8edf2;--muted:#9aa6b4;--line:#2b3744;--accent:#6aa9ff;--pos:#5fcf85;--neg:#ff8a80;--head:#1f2a36;}}
:root[data-theme="dark"]{--serie2:#f0b44c;--bg:#111820;--card:#18212b;--text:#e8edf2;--muted:#9aa6b4;--line:#2b3744;--accent:#6aa9ff;--pos:#5fcf85;--neg:#ff8a80;--head:#1f2a36;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{color:var(--accent);font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.notice{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:.92rem}
.kaarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kaart{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kaart .lbl{color:var(--muted);font-size:.8rem}
.kaart .wrd{font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.uitleg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.92rem}
.uitleg p{margin:6px 0}
.tabel{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--head);font-weight:600;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.hoofd{font-size:.8rem;color:var(--muted)}
.grafiek-kaart{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 8px;margin-top:8px}
.legenda{display:grid;gap:8px;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.leg-item{display:flex;align-items:flex-start;gap:10px}
.leg-item strong{color:var(--text)}
.legenda i{display:inline-block;width:34px;min-width:34px;height:0;border-top:3px solid;margin-top:.7em}
.kleur-k{color:var(--accent)!important} .kleur-p{color:var(--serie2)!important}
.sw-k{border-color:var(--accent)} .sw-p{border-color:var(--serie2);border-top-style:dashed}
#grafiek{width:100%;height:auto;display:block}
#grafiek .raster{stroke:var(--line);stroke-width:1}
#grafiek .as-tekst{fill:var(--muted);font-size:12px;font-family:inherit}
#grafiek .as-titel{fill:var(--muted);font-size:12px;font-weight:600}
#grafiek .as-titel-k{fill:var(--accent)} #grafiek .as-titel-p{fill:var(--serie2)}
#grafiek .lijn-k{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
#grafiek .lijn-p{fill:none;stroke:var(--serie2);stroke-width:2.5;stroke-dasharray:7 5;stroke-linejoin:round}
#grafiek .punt-k{fill:var(--accent)} #grafiek .punt-p{fill:var(--serie2)}
#grafiek{touch-action:none;cursor:crosshair}
.kies{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.kies select{font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:280px;max-width:100%}
.uitlezing{display:flex;flex-wrap:wrap;gap:6px 22px;background:var(--head);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.92rem;font-variant-numeric:tabular-nums;min-height:44px;align-items:center}
.uitlezing span{color:var(--muted)}
.uitlezing strong{color:var(--text)}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.serie-knoppen{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.serie-knop{font:inherit;display:flex;gap:10px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font-size:.9rem}
.serie-knop[aria-pressed="false"]{opacity:.45}
.serie-knop i{display:inline-block;width:34px;min-width:34px;height:0;border-top:3px solid}
.serie-knop .sw-k{border-color:var(--accent)} .serie-knop .sw-p{border-color:var(--serie2);border-top-style:dashed}
tr.doel td{background:var(--head);font-weight:600}

</style>
</head>
<body>
<main>
  <p class="hoofd" style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><a href="index.html" style="color: var(--accent)" data-i18n="pot.terug"></a><span data-taalknop style="color: var(--accent)"></span></p>
  <h1 data-i18n="pot.h1"></h1>
  <p class="sub" data-i18n="pot.sub"></p>
  <div class="kies">
    <label for="deelnemer"><strong data-i18n="pot.deelnemer"></strong></label>
    <select id="deelnemer"></select>
  </div>
  <div class="notice" id="notice"></div>

  <div class="kaarten" id="kaarten"></div>

  <h2 data-i18n="pot.hGrafiek"></h2>
  <div class="grafiek-kaart">
    <div class="serie-knoppen" role="group" data-i18n-attr="aria-label:pot.lijnen">
      <button type="button" class="serie-knop" id="knopP" aria-pressed="true"><i class="sw-p"></i><span><strong class="kleur-p" data-i18n="pot.pensioen"></strong></span></button>
      <button type="button" class="serie-knop" id="knopK" aria-pressed="false"><i class="sw-k"></i><span><strong class="kleur-k" data-i18n="pot.vermogen"></strong></span></button>
    </div>
    <div class="uitlezing" id="uitlezing" aria-live="polite"></div>
    <svg id="grafiek" viewBox="0 0 960 340" role="img" data-i18n-attr="aria-label:pot.grafiekLabel"></svg>
    <p class="hint" data-i18n="pot.hint"></p>
  </div>

  <h2 data-i18n="pot.hMaand"></h2>
  <div class="tabel">
    <table>
      <thead>
        <tr>
          <th data-i18n="pot.kolMaand"></th>
          <th data-i18n="pot.kolInleg"></th>
          <th data-i18n="pot.kolOver"></th>
          <th data-i18n="pot.kolStab"></th>
          <th data-i18n="pot.kolKapitaal"></th>
          <th data-i18n="pot.pensioen"></th>
          <th data-i18n="pot.kolVerandering"></th>
        </tr>
      </thead>
      <tbody id="rijen"></tbody>
      <tfoot id="totaal"></tfoot>
    </table>
  </div>

  <h2 data-i18n="pot.hUitleg"></h2>
  <div class="uitleg">
    <p data-i18n="pot.uitlegKapitaal"></p>
    <p data-i18n="pot.uitlegStab"></p>
    <p id="uitlegPensioen"></p>
  </div>
</main>

<script>
(function () {
  'use strict';
  var cfg = window.PLANNER_CONFIG;
  var reg = cfg.pensioenreglement;
  var I = window.I18N, t = I.t;

  // Testdata: de reeks loopt van START_MAAND t/m EIND_MAAND. Startkapitaal, salaris en geboortedatum komen uit de
  // gekozen deelnemer. Het stabiliteitsrendement hangt af van de leeftijd (zie config.js).
  var START_MAAND = { jaar: 2024, maand: 1 };
  var EIND_MAAND = { jaar: Number(cfg.calculatiedatum.split('-')[0]), maand: Number(cfg.calculatiedatum.split('-')[1]) };  // gelijk aan de calculatiedatum van de planner
  var PREMIE_INDEXATIE = 0.025;      // jaarlijkse stijging van de premie
  var OVER_MIN = -0.012;             // overrendement per maand: ondergrens (fractie van het kapitaal)
  var OVER_BEREIK = 0.027;           // overrendement per maand: bandbreedte
  var SEED = 20260401;               // vaste seed: dezelfde testdata bij elke keer laden
  var doelIdx = null;                // maand uit de link van de pensioenplanner (0 = januari van jaar 0)
  var BASIS_EIND_IDX = null;         // laatste echte maand van de testdata, voor de projectie-melding

  var MAIN = { W: 960, H: 340, L: 96, R: 96, T: 48, B: 12 };

  var geo = null;      // gegevens en geometrie van de grafieken, nodig voor de muisaanwijzing
  var huidig = null;   // gekozen deelnemer met reeks, inkoopfactor OP en pensioenleeftijd
  var toonP = true;    // verwacht pensioen per maand: standaard aan
  var toonK = false;   // verwacht vermogen (kapitaal): standaard uit
  var lastIdx = 0;     // gekozen maand, om de uitlezing na een knopklik te behouden

  function $(id) { return document.getElementById(id); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function maandIdx(s) {
    var d = s.split('-').map(Number);
    return d[0] * 12 + (d[1] - 1);
  }

  // Datum en naam in de gekozen taal; de voorbeeldnamen 'Deelnemer A' tot 'Deelnemer D' worden vertaald.
  function datumNl(s) { return I.datum(s); }
  function naam(d) {
    var m = /^Deelnemer ([A-Z])$/.exec(d.naam);
    return m ? t('kern.deelnemer', { letter: m[1] }) : d.naam;
  }
  function maandLabel(idx) { return I.maanden()[idx % 12] + ' ' + Math.floor(idx / 12); }

  function maandenLijst() {
    var lijst = [];
    var y = START_MAAND.jaar, m = START_MAAND.maand;
    while (y * 12 + m <= EIND_MAAND.jaar * 12 + EIND_MAAND.maand) {
      lijst.push({ jaar: y, maand: m });
      m++; if (m > 12) { m = 1; y++; }
    }
    return lijst;
  }

  // Leeftijd op de calculatiedatum, in jaren.
  function leeftijd(d) {
    return (maandIdx(cfg.calculatiedatum) - maandIdx(d.geboortedatum)) / 12;
  }

  // Pensioenleeftijd voor het verwachte pensioen: de standaardleeftijd, tenzij die al is gepasseerd. Dan de AOW-leeftijd.
  function pensioenLeeftijd(d) {
    return leeftijd(d) < reg.standaardPensioenleeftijd ? reg.standaardPensioenleeftijd : Math.round(reg.aowLeeftijdMaanden / 12);
  }

  // Waarde tussen een jong- en een oud-waarde, lineair op basis van de leeftijd van de deelnemer.
  function naarLeeftijd(d, jong, oud) {
    var s = cfg.stabiliteit;
    var f = (leeftijd(d) - s.leeftijdJong) / (s.leeftijdOud - s.leeftijdJong);
    f = Math.max(0, Math.min(1, f));
    return jong + (oud - jong) * f;
  }

  // Grootste maandelijkse schok van het stabiliteitsrendement, afhankelijk van de leeftijd.
  function maxSchok(d) {
    var s = cfg.stabiliteit;
    return naarLeeftijd(d, s.maxSchokJong, s.maxSchokOud);
  }

  // Bouwt per maand: inleg, overrendement, stabiliteitsrendement, kapitaal en verwacht pensioen.
  // De schok van het stabiliteitsrendement raakt het kapitaal en het verwachte pensioen elk met een leeftijdsafhankelijk
  // aandeel. Bij een negatief stabiliteitsrendement (rente gestegen) daalt het kapitaal en stijgt het pensioen.
  function bouwReeks(d) {
    var pl = pensioenLeeftijd(d);
    var inkoopOP = cfg.inkoopfactorenOP[pl];
    var premieBasis = (Math.min(d.brutoSalaris, reg.maxPensioengevendSalaris) - reg.franchise) * reg.premiepercentage / 12;
    var schokMax = maxSchok(d);
    var aandeelK = naarLeeftijd(d, cfg.stabiliteit.kapitaalAandeelJong, cfg.stabiliteit.kapitaalAandeelOud);
    var aandeelP = naarLeeftijd(d, cfg.stabiliteit.pensioenAandeelJong, cfg.stabiliteit.pensioenAandeelOud);
    var ondergrens = cfg.stabiliteit.ondergrensFractie;
    var rnd = mulberry32(SEED);
    var kap = d.startkapitaal;
    var kp = d.startkapitaal;
    var vorigPensioen = kp / inkoopOP / 12;
    var rijen = [];
    maandenLijst().forEach(function (mnd) {
      var jaarIdx = mnd.jaar - START_MAAND.jaar;
      var inleg = Math.round(premieBasis * Math.pow(1 + PREMIE_INDEXATIE, jaarIdx) * (1 + (rnd() - 0.5) * 0.06));
      var over = Math.round(kap * (OVER_MIN + rnd() * OVER_BEREIK));
      var teken = rnd() < 0.5 ? -1 : 1;
      var grootte = schokMax * (ondergrens + (1 - ondergrens) * rnd());
      var ruwe = kap * teken * grootte;          // de schok zoals die op de rentehedge valt
      var stab = Math.round(ruwe * aandeelK);     // deel dat in het kapitaal terechtkomt
      var stabP = ruwe * aandeelP;                // deel dat in het verwachte pensioen terechtkomt (omgekeerd)
      kap += inleg + over + stab;
      kp += inleg + over - stabP;
      var pensioen = kp / inkoopOP / 12;
      rijen.push({
        idx: mnd.jaar * 12 + (mnd.maand - 1),
        inleg: inleg, over: over, stab: stab,
        kapitaal: kap, pensioen: pensioen,
        wijziging: pensioen - vorigPensioen
      });
      vorigPensioen = pensioen;
    });
    return { deelnemer: d, rijen: rijen, inkoopOP: inkoopOP, pensLeeftijd: pl, schokMax: schokMax };
  }

  function geld(v) { return I.eur(v); }
  function klasse(v) { return v > 0 ? 'pos' : (v < 0 ? 'neg' : ''); }
  function cel(v, cls) { return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + geld(v) + '</td>'; }

  function render(i) {
    var d = cfg.deelnemers[i];
    huidig = bouwReeks(d);
    var rijen = huidig.rijen;
    $('deelnemer').value = i;
    var origRij = rijen.filter(function (r) { return r.idx === BASIS_EIND_IDX; })[0];
    var projectie = origRij && rijen[rijen.length - 1].idx > BASIS_EIND_IDX
      ? ' ' + t('pot.projectie', { maand: maandLabel(origRij.idx) }) : '';
    $('notice').textContent = t('pot.melding', { naam: naam(d), geboren: datumNl(d.geboortedatum), kapitaal: geld(d.startkapitaal) }) + projectie;

    tekenGrafieken(rijen);
    var doelPos = doelIdx === null ? -1 : rijen.map(function (r) { return r.idx; }).indexOf(doelIdx);
    var verschuiving = rijen.length - geo.data.length;
    toon(doelPos >= verschuiving ? doelPos - verschuiving : geo.data.length - 1);

    var som = { inleg: 0, over: 0, stab: 0 };
    var html = '';
    rijen.forEach(function (r) {
      som.inleg += r.inleg; som.over += r.over; som.stab += r.stab;
      html += '<tr' + (r.idx === doelIdx ? ' class="doel" id="doel"' : '') + '><td>' + maandLabel(r.idx) + '</td>' +
        cel(r.inleg) + cel(r.over, klasse(r.over)) + cel(r.stab, klasse(r.stab)) +
        cel(r.kapitaal) + cel(r.pensioen) + cel(r.wijziging, klasse(r.wijziging)) + '</tr>';
    });
    $('rijen').innerHTML = html;
    if (doelIdx !== null && $('doel')) $('doel').scrollIntoView({ block: 'center' });

    var laatste = rijen[rijen.length - 1];
    $('totaal').innerHTML =
      '<tr><td>' + t('pot.totaal', { n: rijen.length }) + '</td>' +
      cel(som.inleg) + cel(som.over, klasse(som.over)) + cel(som.stab, klasse(som.stab)) +
      cel(laatste.kapitaal) + cel(laatste.pensioen) + '<td></td></tr>';

    var kaarten = [
      [t('pot.kStart'), d.startkapitaal],
      [t('pot.kInleg'), som.inleg],
      [t('pot.kolOver'), som.over],
      [t('pot.kolStab'), som.stab],
      [t('pot.kKapitaal', { maand: maandLabel(laatste.idx) }), laatste.kapitaal],
      [t('pot.pensioen'), laatste.pensioen]
    ];
    $('kaarten').innerHTML = kaarten.map(function (k) {
      return '<div class="kaart"><div class="lbl">' + k[0] + '</div><div class="wrd">' + geld(k[1]) + '</div></div>';
    }).join('');

    $('uitlegPensioen').innerHTML = t('pot.uitlegPensioen', { leeftijd: huidig.pensLeeftijd, factor: I.getal(huidig.inkoopOP, 1, 1) });
  }

  // Toont de cijfers van één maand en markeert die maand in beide grafieken.
  function toon(i) {
    if (!geo) return;
    lastIdx = i;
    var r = geo.data[i];
    var delen = ['<span>' + t('pot.kolMaand') + ' <strong>' + maandLabel(r.idx) + '</strong></span>'];
    if (toonK) delen.push('<span>' + t('pot.kapitaal') + ' <strong style="color: var(--accent)">' + geld(r.kapitaal) + '</strong></span>');
    if (toonP) {
      delen.push('<span>' + t('pot.pensioen') + ' <strong style="color: var(--serie2)">' + geld(r.pensioen) + '</strong></span>');
      delen.push('<span>' + t('pot.veranderingVorige') + ' <strong class="' + klasse(r.wijziging) + '">' + geld(r.wijziging) + '</strong></span>');
    }
    $('uitlezing').innerHTML = delen.join('');

    var x = geo.x(i).toFixed(1);
    $('hl').setAttribute('x1', x);
    $('hl').setAttribute('x2', x);
    $('hk').setAttribute('cx', x);
    $('hk').setAttribute('cy', geo.yK(r.kapitaal).toFixed(1));
    $('hk').setAttribute('visibility', toonK ? 'visible' : 'hidden');
    $('hp').setAttribute('cx', x);
    $('hp').setAttribute('cy', geo.yP(r.pensioen).toFixed(1));
    $('hp').setAttribute('visibility', toonP ? 'visible' : 'hidden');
    $('hover').setAttribute('visibility', 'visible');
  }

  function naarIndex(e) {
    var rect = $('grafiek').getBoundingClientRect();
    var sx = (e.clientX - rect.left) * MAIN.W / rect.width;
    var n = geo.data.length;
    var i = Math.round((sx - MAIN.L) / (MAIN.W - MAIN.L - MAIN.R) * (n - 1));
    return Math.max(0, Math.min(n - 1, i));
  }

  function kies(v) {
    var macht = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var f = v / macht;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * macht;
  }

  function assen(waarden, aantal) {
    var min = Math.min.apply(null, waarden), max = Math.max.apply(null, waarden);
    var stap = kies(Math.max((max - min) / aantal, 1));
    var lo = Math.floor(min / stap) * stap, hi = Math.ceil(max / stap) * stap;
    if (hi === lo) hi = lo + stap;
    return { lo: lo, hi: hi, stap: stap };
  }

  function tekenGrafieken(rijen) {
    var data = rijen.slice(-24);
    var n = data.length;

    // Hoofdgrafiek: kapitaal en verwacht pensioen per maand, elk met een eigen schaal. Alleen de aangezette lijnen.
    var M = MAIN;
    var pw = M.W - M.L - M.R, ph = M.H - M.T - M.B;
    var k = assen(data.map(function (r) { return r.kapitaal; }), 4);
    var p = assen(data.map(function (r) { return r.pensioen; }), 4);
    function x(i) { return M.L + i * pw / (n - 1); }
    function yK(v) { return M.T + ph * (1 - (v - k.lo) / (k.hi - k.lo)); }
    function yP(v) { return M.T + ph * (1 - (v - p.lo) / (p.hi - p.lo)); }
    geo = { data: data, x: x, yK: yK, yP: yP, n: n };

    // Linker as: kapitaal als dat aan staat, anders het pensioen. Rechter as alleen als beide lijnen aan staan.
    var links = toonK ? k : p, linksY = toonK ? yK : yP;
    var beide = toonK && toonP;

    var g = '<rect x="' + M.L + '" y="' + M.T + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>';
    for (var tick = links.lo; tick <= links.hi + links.stap / 2; tick += links.stap) {
      var yy = linksY(tick).toFixed(1);
      g += '<line class="raster" x1="' + M.L + '" x2="' + (M.W - M.R) + '" y1="' + yy + '" y2="' + yy + '"/>';
      g += '<text class="as-tekst" x="' + (M.L - 8) + '" y="' + (+yy + 4) + '" text-anchor="end">' + I.getal(Math.round(tick)) + '</text>';
    }
    if (beide) {
      for (var u = p.lo; u <= p.hi + p.stap / 2; u += p.stap) {
        var y2 = yP(u).toFixed(1);
        g += '<text class="as-tekst" x="' + (M.W - M.R + 8) + '" y="' + (+y2 + 4) + '" text-anchor="start">' + I.getal(Math.round(u)) + '</text>';
      }
      g += '<text class="as-titel as-titel-k" x="0" y="22" text-anchor="start">' + t('pot.asKapitaal') + '</text>';
      g += '<text class="as-titel as-titel-p" x="' + M.W + '" y="22" text-anchor="end">' + t('pot.asPensioen') + '</text>';
    } else if (toonK) {
      g += '<text class="as-titel as-titel-k" x="0" y="22" text-anchor="start">' + t('pot.asKapitaal') + '</text>';
    } else {
      g += '<text class="as-titel as-titel-p" x="0" y="22" text-anchor="start">' + t('pot.asPensioen') + '</text>';
    }

    if (toonK) {
      var pk = [];
      data.forEach(function (r, i) { pk.push(x(i).toFixed(1) + ',' + yK(r.kapitaal).toFixed(1)); });
      g += '<path class="lijn-k" d="M' + pk.join('L') + '"/>';
      data.forEach(function (r, i) { g += '<circle class="punt-k" cx="' + x(i).toFixed(1) + '" cy="' + yK(r.kapitaal).toFixed(1) + '" r="2.5"/>'; });
    }
    if (toonP) {
      var pp = [];
      data.forEach(function (r, i) { pp.push(x(i).toFixed(1) + ',' + yP(r.pensioen).toFixed(1)); });
      g += '<path class="lijn-p" d="M' + pp.join('L') + '"/>';
      data.forEach(function (r, i) { g += '<circle class="punt-p" cx="' + x(i).toFixed(1) + '" cy="' + yP(r.pensioen).toFixed(1) + '" r="2.5"/>'; });
    }
    g += '<g id="hover" pointer-events="none" visibility="hidden">' +
      '<line id="hl" y1="' + M.T + '" y2="' + (M.H - M.B) + '" stroke="var(--muted)" stroke-width="1.5"/>' +
      '<circle id="hk" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>' +
      '<circle id="hp" r="6" fill="var(--serie2)" stroke="var(--card)" stroke-width="2"/>' +
      '</g>';
    $('grafiek').innerHTML = g;
    syncKnoppen();
  }

  function syncKnoppen() {
    $('knopK').setAttribute('aria-pressed', toonK ? 'true' : 'false');
    $('knopP').setAttribute('aria-pressed', toonP ? 'true' : 'false');
  }

  // Knop aan of uit. Er blijft altijd minstens één lijn aan.
  function wissel(serie) {
    if (serie === 'k') toonK = !toonK; else toonP = !toonP;
    if (!toonK && !toonP) { if (serie === 'k') toonK = true; else toonP = true; syncKnoppen(); return; }
    if (huidig) {
      tekenGrafieken(huidig.rijen);
      toon(Math.min(lastIdx, geo.data.length - 1));
    }
  }

  function vulDeelnemers() {
    var sel = $('deelnemer'), oud = sel.value;
    sel.innerHTML = '';
    cfg.deelnemers.forEach(function (d, i) {
      sel.add(new Option(t('demo.optieDeelnemer', { naam: naam(d), geboren: datumNl(d.geboortedatum), kapitaal: geld(d.startkapitaal) }), i));
    });
    if (oud !== '') sel.value = oud;
  }

  function init() {
    I.vertaal();
    var sel = $('deelnemer');
    vulDeelnemers();
    I.opWissel(function () {
      vulDeelnemers();
      render(Number(sel.value));
    });
    sel.addEventListener('change', function () { render(Number(sel.value)); });
    $('knopP').addEventListener('click', function () { wissel('p'); });
    $('knopK').addEventListener('click', function () { wissel('k'); });

    function aanwijzen(e) { if (geo) toon(naarIndex(e)); }
    function verlaten() { if (geo) toon(geo.data.length - 1); }
    ['grafiek'].forEach(function (id) {
      var el = $(id);
      el.addEventListener('pointermove', aanwijzen);
      el.addEventListener('pointerdown', aanwijzen);
      el.addEventListener('pointerleave', verlaten);
    });

    // Links uit de pensioenplanner: ?d=<deelnemer>&maand=jjjj-mm. Een maand na de testdata verlengt de reeks.
    var params = new URLSearchParams(window.location.search);
    var dParam = Number(params.get('d'));
    var deelIdx = params.get('d') !== null && cfg.deelnemers[dParam] ? dParam : cfg.standaardDeelnemer;
    var maandParam = params.get('maand');
    if (maandParam && /^\d{4}-\d{2}$/.test(maandParam)) {
      var mp = maandParam.split('-').map(Number);
      if (mp[1] >= 1 && mp[1] <= 12) {
        doelIdx = mp[0] * 12 + (mp[1] - 1);
        BASIS_EIND_IDX = EIND_MAAND.jaar * 12 + (EIND_MAAND.maand - 1);
        if (doelIdx > BASIS_EIND_IDX) EIND_MAAND = { jaar: mp[0], maand: mp[1] };
      }
    }
    render(deelIdx);
  }

  init();
})();
</script>
</body>
</html>
