<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="over.titel">Over deze demo</title>
<script src="i18n/i18n.js"></script>
<script src="i18n/nl.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/da.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--text:#1d2630;--muted:#5b6675;--line:#dfe3e8;--accent:#0a4f9c;--head:#eef2f7;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111820;--card:#18212b;--text:#e8edf2;--muted:#9aa6b4;--line:#2b3744;--accent:#6aa9ff;--head:#1f2a36;}}
:root[data-theme="dark"]{--bg:#111820;--card:#18212b;--text:#e8edf2;--muted:#9aa6b4;--line:#2b3744;--accent:#6aa9ff;--head:#1f2a36;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{color:var(--accent);font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.hoofd{font-size:.8rem;color:var(--muted)}
.uitleg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 34px;margin:0}
.uitleg li{margin:4px 0}
.fictief{background:var(--head);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;margin:16px 0 0;font-weight:600}
</style>
</head>
<body>
<main>
  <p class="hoofd" style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><a href="index.html" style="color: var(--accent)" data-i18n="over.terug"></a><span data-taalknop style="color: var(--accent)"></span></p>
  <h1 data-i18n="over.h1"></h1>
  <p class="sub" data-i18n="over.intro"></p>

  <h2 data-i18n="over.watH2"></h2>
  <p data-i18n="over.watTekst"></p>
  <ul class="uitleg">
    <li data-i18n="over.keuze1"></li>
    <li data-i18n="over.keuze2"></li>
    <li data-i18n="over.keuze3"></li>
    <li data-i18n="over.keuze4"></li>
    <li data-i18n="over.keuze5"></li>
  </ul>
  <p class="fictief" data-i18n="over.fictief"></p>

  <h2 data-i18n="over.hoeH2"></h2>
  <ol class="uitleg">
    <li data-i18n="over.stap1"></li>
    <li data-i18n="over.stap2"></li>
    <li data-i18n="over.stap3"></li>
    <li data-i18n="over.stap4"></li>
  </ol>
</main>
<script>
  window.I18N.vertaal();
</script>
</body>
</html>
