<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonds A · Pensioengesprek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Instrument+Sans:wght@500;600&display=swap">
<link rel="stylesheet" href="balk.css">
<style>
  :root {
    color-scheme: light;
    --bg: #f7efe6; --kaart: #fffaf5; --inkt: #3d2b25; --zacht: #7a645a; --lijn: #e6d3c3;
    --accent: #c8553d; --accent-donker: #a3402b; --accent-zacht: #f6dfd3; --groen: #4f7a4a; --groen-zacht: #e3eedd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--inkt); font: 18px/1.6 "Nunito Sans", system-ui, sans-serif; }
  .kop { display: flex; align-items: center; justify-content: space-between; max-width: 820px; margin: 0 auto; padding: 22px 24px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font: 600 20px/1 "Fraunces", Georgia, serif; white-space: nowrap; margin-right: 16px; }
  .logo span.merk { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px; }
  .voortgang { display: flex; gap: 6px; flex-shrink: 1; min-width: 0; }
  .voortgang i { width: 26px; min-width: 8px; flex-shrink: 1; height: 6px; border-radius: 3px; background: var(--lijn); }
  .voortgang i.klaar { background: var(--accent); }
  .podium { max-width: 820px; margin: 0 auto; padding: 28px 24px 140px; }
  .coach { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
  .coach .avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--accent-zacht); display: grid; place-items: center; font-size: 22px; }
  .coach .wolk { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 4px 18px 18px 18px; padding: 12px 18px; color: var(--zacht); max-width: 620px; }
  h1 { font: 600 40px/1.15 "Fraunces", Georgia, serif; margin: 6px 0 24px; letter-spacing: -.01em; }
  .scherm.nieuw { animation: in .35s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .scherm.nieuw { animation: none; } }
  .keuzes { display: grid; gap: 14px; }
  .keuzes.twee { grid-template-columns: 1fr 1fr; }
  .keuze {
    display: block; width: 100%; text-align: left; padding: 18px 22px; border-radius: 18px; border: 2px solid var(--lijn);
    background: var(--kaart); color: inherit; font: inherit; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .keuze:hover { border-color: var(--accent); transform: translateY(-1px); }
  .keuze:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .keuze[aria-pressed="true"] { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px var(--accent-zacht); }
  .keuze .titel { display: block; font-weight: 700; font-size: 19px; }
  .keuze .uitleg { display: block; color: var(--zacht); font-size: 16px; margin-top: 2px; }
  .keuze .bedrag { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--groen-zacht); color: var(--groen); font-weight: 700; font-size: 15px; }
  .keuze[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 12px 20px; border-radius: 99px; border: 2px solid var(--lijn); background: var(--kaart); font: inherit; font-weight: 700; color: inherit; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .schuif { margin: 18px 0 0; padding: 18px 22px; border-radius: 18px; background: #fff; border: 1px solid var(--lijn); }
  .schuif label { display: flex; justify-content: space-between; font-weight: 700; }
  .schuif input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 10px; }
  .schuif small { color: var(--zacht); font-size: 15px; }
  .navigatie { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
  .knop { padding: 14px 28px; border-radius: 99px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .knop:hover { background: var(--accent-donker); }
  .knop:focus-visible { outline: 3px solid var(--inkt); outline-offset: 2px; }
  .knop.stil { background: none; color: var(--zacht); padding-left: 0; }
  .knop.stil:hover { color: var(--inkt); }
  .tip { margin-top: 18px; color: var(--zacht); font-size: 16px; }
  /* Resultaat */
  .groot { font: 600 64px/1 "Fraunces", Georgia, serif; color: var(--accent); margin: 4px 0 6px; }
  .resultaat { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 24px; padding: 28px 30px; }
  .fasen { display: flex; gap: 6px; margin: 26px 0 10px; height: 74px; align-items: flex-end; }
  .fase { border-radius: 10px 10px 4px 4px; background: var(--accent); position: relative; min-width: 8px; }
  .fase.later { background: #e09a83; }
  .fase-labels { display: flex; gap: 6px; font-size: 14px; color: var(--zacht); }
  .fase-labels div { min-width: 8px; }
  .zinnen { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .zinnen li { padding-left: 30px; position: relative; }
  .zinnen li::before { content: "✓"; position: absolute; left: 0; top: 0; color: var(--groen); font-weight: 700; }
  .wijzig { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .wijzig button { font: inherit; font-size: 15px; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--lijn); background: #fff; color: var(--inkt); cursor: pointer; }
  .wijzig button:hover { border-color: var(--accent); }
  .wissel { display: inline-flex; border: 1px solid var(--lijn); border-radius: 99px; overflow: hidden; font-size: 15px; }
  .wissel button { border: 0; background: none; font: inherit; padding: 6px 14px; cursor: pointer; color: var(--zacht); }
  .wissel button[aria-pressed="true"] { background: var(--inkt); color: #fff; }
  /* Meelopend bedrag */
  .pil {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: baseline; padding: 12px 24px; border-radius: 99px;
    background: var(--inkt); color: #fff; box-shadow: 0 12px 30px -12px rgba(61,43,37,.6); font-size: 16px; white-space: nowrap;
  }
  .pil strong { font: 600 22px/1 "Fraunces", Georgia, serif; color: #ffd9c9; }
  .pil[hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  /* Keuzebegeleiding: doelvraag, signalen, vergelijking met nu, wat nu */
  h2 { font: 600 24px/1.25 "Fraunces", Georgia, serif; margin: 30px 0 12px; }
  .vraag { font-weight: 700; margin: 26px 0 10px; }
  .vraag small { display: block; font-weight: 400; color: var(--zacht); font-size: 15px; }
  .past { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 99px; background: var(--accent-zacht); color: var(--accent-donker); font-size: 13px; font-weight: 700; vertical-align: 2px; }
  .signalen { display: grid; gap: 12px; }
  .signaal { border-left: 5px solid var(--accent); background: #fff; border-radius: 6px 16px 16px 6px; padding: 14px 18px; }
  .signaal.info { border-left-color: #d9a441; }
  .signaal strong { display: block; }
  .signaal p { margin: 4px 0 0; color: var(--zacht); font-size: 16px; }
  .signaal button { margin-top: 8px; font: inherit; font-size: 15px; padding: 5px 14px; border-radius: 99px; border: 1px solid var(--lijn); background: var(--kaart); color: var(--inkt); cursor: pointer; }
  .signaal button:hover { border-color: var(--accent); }
  .geen-signaal { background: var(--groen-zacht); color: var(--groen); border-radius: 16px; padding: 12px 18px; font-size: 16px; }
  .vergelijk { display: grid; gap: 10px; }
  .vg-rij { display: grid; grid-template-columns: 190px 1fr 120px; gap: 12px; align-items: center; font-size: 16px; }
  .vg-balk { height: 14px; border-radius: 7px; background: var(--lijn); overflow: hidden; }
  .vg-balk i { display: block; height: 100%; border-radius: 7px; background: var(--accent); }
  .vg-rij.nu .vg-balk i { background: var(--inkt); }
  .vg-rij .r { text-align: right; font-weight: 700; }
  .vg-rij .r small { display: block; font-weight: 400; color: var(--zacht); font-size: 13px; }
  @media (max-width: 600px) { .vg-rij { grid-template-columns: 1fr 100px; } .vg-balk { grid-column: 1 / -1; grid-row: 2; } }
  .acties { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .acties li { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 18px; padding: 14px 18px 14px 54px; position: relative; }
  .acties li::before { content: attr(data-nr); position: absolute; left: 16px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  .acties strong { display: block; }
  .acties span { color: var(--zacht); font-size: 16px; }
  .acties a { color: var(--accent-donker); }
  .samenvatting { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 16px; }
  .samenvatting li { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--lijn); padding: 6px 0; }
  .samenvatting li span:first-child { color: var(--zacht); }
  @media print {
    .vbalk, .kop, .pil, .navigatie, .wijzig, .coach, .geen-print { display: none !important; }
    body { background: #fff; font-size: 14px; }
    .podium { padding: 0; }
  }
</style>
</head>
<body>
<div class="vbalk" role="region" aria-label="Ontwerpvariant">
  <span class="vb-tag">Ontwerpvariant</span>
  <span class="vb-naam"><strong>Fonds A</strong> · coachend gesprek (1 van 3)</span>
  <span class="vb-noot">Illustratief: zelfde rekenkern als de demo, fictieve huisstijl</span>
  <span class="vb-rechts">
    <nav aria-label="Varianten"><a href="fonds-a.html" aria-current="page">A</a><a href="fonds-b.html">B</a><a href="fonds-c.html">C</a></nav>
    <a class="vb-link" href="index.html">Alle varianten</a>
    <a class="vb-link" href="../index.html">&larr; Terug naar de demo</a>
  </span>
</div>

<header class="kop">
  <div class="logo"><span class="merk" aria-hidden="true">A</span> Fonds A</div>
  <div class="voortgang" id="voortgang" aria-hidden="true"></div>
</header>

<main class="podium" id="podium" aria-live="polite"></main>

<div class="pil" id="pil" hidden></div>

<script src="../config.js"></script>
<script src="../config-overlay.js"></script>
<script src="../engine.js"></script>
<script src="kern.js"></script>
<script>
(function () {
  'use strict';
  var K = window.VariantKern, C = K.C;
  var eur = K.eur;
  // Stappen: 0 wie, 1 doel, 2 wanneer, 3 partner, 4 verdeling, 5 resultaat, 6 wat nu.
  var WIE = 0, DOEL = 1, WANNEER = 2, PARTNER = 3, VERDELING = 4, RESULTAAT = 5, WATNU = 6;
  var STAPPEN = 7;
  var stap = 0;
  // Illustratieve grens voor het signaal 'later minder dan dit deel van je laatste salaris'.
  var GRENS_INKOMEN = 0.7;
  var s = {
    deelnemer: C.standaardDeelnemer, start: 'aow', leeftijd: C.pensioenreglement.standaardPensioenleeftijd,
    partnerPct: C.partnerpensioen.standaardPct, partnerKeuze: 'max',
    overbrug: false, tijdelijk: false,   // AOW-overbrugging en tijdelijk hoger pensioen, los van elkaar aan of uit
    topaow: 'max', tophlPct: 33, basis: 'netto',
    reeel: null,  // null = standaard (pensioendatum binnen 2 jaar nominaal, anders reëel)
    // Antwoorden op de doelvraag. Ze sturen alleen uitleg, nadruk en signalen; de standaardkeuzes blijven gelijk.
    doel: null,     // 'nu' (meer in de eerste jaren) | 'zeker' (zekerheid voor later) | 'weetniet'
    partner: null,  // 'ja' | 'nee'
    bezit: {}       // huis, spaar, elders: wat de deelnemer naast dit pensioen heeft
  };

  function keuzes(extra) {
    var k = {
      deelnemer: s.deelnemer, start: s.start, leeftijd: s.leeftijd, partnerPct: s.partnerPct,
      topaow: s.overbrug ? s.topaow : 0,
      tophlPct: s.tijdelijk ? s.tophlPct : 0,
      tophlEind: null, basis: s.basis, reeel: s.reeel
    };
    return Object.assign(k, extra || {});
  }
  function r() { return K.bereken(keuzes()); }
  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function eenheid(res) { return s.basis + (res.reeel ? ', in euro’s van vandaag' : ''); }

  function coach(tekst) {
    return '<div class="coach"><div class="avatar" aria-hidden="true">&#128075;</div><div class="wolk">' + tekst + '</div></div>';
  }
  function nav(volgende, label) {
    return '<div class="navigatie">' +
      (stap > 0 ? '<button class="knop stil" type="button" data-naar="' + (stap - 1) + '">&larr; Vorige</button>' : '<span></span>') +
      (volgende !== undefined ? '<button class="knop" type="button" data-naar="' + volgende + '">' + (label || 'Volgende') + ' &rarr;</button>' : '') +
      '</div>';
  }

  // Stap 1: voor wie rekenen we?
  function schermWie() {
    var html = coach('Hoi! Ik help je in een paar vragen op weg. Voor deze voorbeeldberekening kies je eerst een deelnemer.') +
      '<h1>Voor wie rekenen we?</h1><div class="keuzes twee">';
    C.deelnemers.forEach(function (d, i) {
      var p = K.deelnemer(i);
      html += '<button class="keuze" type="button" data-deelnemer="' + i + '" aria-pressed="' + (s.deelnemer === i) + '">' +
        '<span class="titel">' + esc(d.naam) + ', ' + p.leeftijdJaar + ' jaar</span>' +
        '<span class="uitleg">Al opgebouwd: ' + eur(d.startkapitaal) + '<br>Salaris: ' + eur(d.brutoSalaris) + ' per jaar</span></button>';
    });
    return html + '</div>' + nav(DOEL, 'Aan de slag');
  }

  function past(ja) { return ja ? '<span class="past">Past bij wat je aangaf</span>' : ''; }

  // Stap 2: wat vind je belangrijk? De antwoorden bepalen welke uitleg en signalen je later ziet.
  function schermDoel() {
    var html = coach('Voordat we gaan rekenen: wat vind je zelf belangrijk? Dan kan ik je straks wijzen op wat bij jou past, en op keuzes die misschien minder goed uitpakken. Je mag ook vragen overslaan.') +
      '<h1>Wat vind je belangrijk?</h1>' +
      '<p class="vraag">Wat past het best bij jou?</p><div class="keuzes">';
    [['nu', 'Meer te besteden in de eerste jaren', 'Zolang je nog fit bent, wil je wat meer kunnen doen.'],
     ['zeker', 'Zekerheid voor later', 'Je wilt een stabiel bedrag, ook als je 85 bent.'],
     ['weetniet', 'Weet ik nog niet', 'Geen probleem, je ziet straks wat elke keuze doet.']].forEach(function (o) {
      html += '<button class="keuze" type="button" data-doel="' + o[0] + '" aria-pressed="' + (s.doel === o[0]) + '">' +
        '<span class="titel">' + o[1] + '</span><span class="uitleg">' + o[2] + '</span></button>';
    });
    html += '</div><p class="vraag">Heb je een partner?<small>Getrouwd, geregistreerd of samenwonend.</small></p><div class="chips">' +
      '<button class="chip" type="button" data-heeftpartner="ja" aria-pressed="' + (s.partner === 'ja') + '">Ja</button>' +
      '<button class="chip" type="button" data-heeftpartner="nee" aria-pressed="' + (s.partner === 'nee') + '">Nee</button></div>' +
      '<p class="vraag">Wat heb je naast dit pensioen?<small>Kies alles wat van toepassing is.</small></p><div class="chips">';
    [['huis', 'Een eigen huis'], ['spaar', 'Spaargeld of beleggingen'], ['elders', 'Pensioen bij een andere werkgever']].forEach(function (o) {
      html += '<button class="chip" type="button" data-bezit="' + o[0] + '" aria-pressed="' + !!s.bezit[o[0]] + '">' + o[1] + '</button>';
    });
    return html + '</div>' + nav(WANNEER);
  }

  // Stap 3: wanneer wil je stoppen?
  function schermWanneer() {
    var lijst = K.leeftijden(s.deelnemer);
    var aowJaar = K.AOW_M % 12 === 0 ? K.AOW_JAREN : null;
    var html = coach('Je AOW begint op ' + K.AOW_LABEL + '. Je kunt eerder of later stoppen. Kies wat bij je past, je kunt het altijd nog aanpassen.') +
      '<h1>Wanneer wil je stoppen met werken?</h1><div class="chips">';
    html += '<button class="chip" type="button" data-start="aow" aria-pressed="' + (s.start === 'aow') + '">Als mijn AOW begint (' + K.AOW_LABEL + ')</button>';
    lijst.forEach(function (j) {
      if (j === aowJaar) return;
      html += '<button class="chip" type="button" data-leeftijd="' + j + '" aria-pressed="' + (s.start === 'ander' && s.leeftijd === j) + '">' + j + ' jaar</button>';
    });
    var res = r();
    html += '</div><p class="tip">Dan krijg je vanaf ' + res.tekst.pensioendatum + ' ongeveer <strong>' + eur(res.eerst) + '</strong> per maand aan pensioen (' + eenheid(res) + ').</p>';
    return html + nav(PARTNER);
  }

  // Stap 4: partner
  function schermPartner() {
    var max = C.partnerpensioen.maxPct;
    var uitleg = 'Als je overlijdt, kan je partner een pensioen krijgen. Dat betaal je uit je eigen pensioen: hoe meer voor je partner, hoe minder voor jezelf.';
    if (s.partner === 'ja') uitleg += ' Je gaf aan dat je een partner hebt. Kies je minder of niets, bespreek dat dan samen.';
    if (s.partner === 'nee') uitleg += ' Je gaf aan dat je geen partner hebt. Dan heb je partnerpensioen meestal niet nodig.';
    var html = coach(uitleg) +
      '<h1>Wil je dat je partner iets krijgt als je overlijdt?</h1><div class="keuzes">';
    var opties = [
      ['max', 'Ja, zo veel mogelijk', max + '% van je pensioen', max],
      ['minder', 'Ja, maar minder', 'Je kiest zelf hoeveel', null],
      ['geen', 'Nee, niet nodig', 'Bijvoorbeeld als je geen partner hebt', 0]
    ];
    opties.forEach(function (o) {
      var pct = o[3] === null ? (s.partnerKeuze === 'minder' ? s.partnerPct : Math.round(max / 2)) : o[3];
      var res = K.bereken(keuzes({ partnerPct: pct }));
      html += '<button class="keuze" type="button" data-partner="' + o[0] + '" aria-pressed="' + (s.partnerKeuze === o[0]) + '">' +
        '<span class="titel">' + o[1] + past(o[0] === 'geen' ? s.partner === 'nee' : (o[0] === 'max' && s.partner === 'ja')) + '</span><span class="uitleg">' + o[2] + '</span>' +
        '<span class="bedrag">Jij: ' + eur(res.eerst) + ' p/m' + (pct > 0 ? ' · partner: ' + eur(res.partner) + ' p/m' : '') + '</span></button>';
    });
    html += '</div>';
    if (s.partnerKeuze === 'minder') {
      html += '<div class="schuif"><label for="partnerSchuif"><span>Voor je partner</span><span>' + s.partnerPct + '%</span></label>' +
        '<input id="partnerSchuif" type="range" min="' + C.partnerpensioen.minPct + '" max="' + max + '" step="5" value="' + s.partnerPct + '">' +
        '<small>Percentage van je eigen pensioen dat je partner krijgt na je overlijden.</small></div>';
    }
    return html + nav(VERDELING);
  }

  // Stap 5: verdeling
  function schermVerdeling() {
    var basisRes = K.bereken(keuzes({ topaow: 0, tophlPct: 0 }));
    var uitleg = 'Je kunt je pensioen gelijk over de jaren verdelen, of de eerste jaren wat meer krijgen. Dat laatste kan prettig zijn als je vóór je AOW stopt. Je levenslange pensioen wordt daarna wel lager. De twee manieren om eerst meer te krijgen kun je ook combineren.';
    if (s.doel === 'zeker') uitleg += ' Je gaf aan dat zekerheid voor later belangrijk is. Let dus vooral op het bedrag ná de eerste jaren.';
    if (s.doel === 'nu') uitleg += ' Je gaf aan dat je de eerste jaren meer wilt. Kijk ook wat er daarna overblijft.';
    var html = coach(uitleg) +
      '<h1>Hoe wil je je pensioen verdelen?</h1><div class="keuzes">';

    function regel(res) {
      if (res.u.t1 > 0 || res.u.t2 > 0) {
        var tot = res.u.t1 > 0 ? 'tot je AOW' : 'tot ' + res.tekst.tophlEind.split(',')[0];
        return eur(res.eerst) + ' p/m ' + tot + ', daarna ' + eur(res.later) + ' p/m';
      }
      return eur(res.eerst) + ' p/m, elke maand hetzelfde';
    }

    var magOverbrug = basisRes.voorAow && basisRes.maxT1 > 0;
    var magTijdelijk = basisRes.tophlMogelijk;
    var metOverbrug = s.overbrug && magOverbrug, metTijdelijk = s.tijdelijk && magTijdelijk;

    // "Gelijk verdeeld" zet beide uit. De andere twee tegels zijn schakelaars die samen aan kunnen.
    html += '<button class="keuze" type="button" data-verdeling="gelijk" aria-pressed="' + (!metOverbrug && !metTijdelijk) + '">' +
      '<span class="titel">Gelijk verdeeld' + past(s.doel === 'zeker') + '</span><span class="uitleg">Elke maand ongeveer hetzelfde bedrag, je hele leven lang.</span>' +
      '<span class="bedrag">' + regel(basisRes) + '</span></button>';

    // Het bedrag op een tegel laat het effect van die keuze alleen zien.
    var resO = K.bereken(keuzes({ topaow: s.overbrug ? s.topaow : 'max', tophlPct: 0 }));
    html += '<button class="keuze" type="button" data-verdeling="overbrug" aria-pressed="' + metOverbrug + '"' + (magOverbrug ? '' : ' disabled') + '>' +
      '<span class="titel">Extra tot mijn AOW begint' + past(magOverbrug && s.doel === 'nu') + '</span><span class="uitleg">' +
      (magOverbrug ? 'Je overbrugt de jaren zonder AOW met een hoger bedrag.' : 'Kan alleen als je vóór je AOW-leeftijd stopt.') + '</span>' +
      (magOverbrug ? '<span class="bedrag">' + regel(resO) + '</span>' : '') + '</button>';

    var resT = K.bereken(keuzes({ topaow: 0, tophlPct: s.tijdelijk ? s.tophlPct : 33 }));
    html += '<button class="keuze" type="button" data-verdeling="tijdelijk" aria-pressed="' + metTijdelijk + '"' + (magTijdelijk ? '' : ' disabled') + '>' +
      '<span class="titel">Eerst wat meer, daarna wat minder' + past(magTijdelijk && s.doel === 'nu') + '</span><span class="uitleg">Een tijdelijk hoger pensioen ' +
      (basisRes.voorAow ? 'tot je AOW-leeftijd.' : 'in de eerste jaren.') + '</span>' +
      (magTijdelijk ? '<span class="bedrag">' + regel(resT) + '</span>' : '') + '</button></div>';

    if (metOverbrug && metTijdelijk) {
      var samen = r();
      html += '<p class="tip">Samen: <strong>' + regel(samen) + '</strong> (' + eenheid(samen) + '). Je levenslange pensioen is dan ' +
        eur(basisRes.later - samen.later) + ' per maand lager dan bij gelijk verdeeld.</p>';
    }

    if (metOverbrug) {
      var max = resO.maxT1;
      var waarde = s.topaow === 'max' ? max : s.topaow;
      html += '<div class="schuif"><label for="t1Schuif"><span>Extra per jaar tot je AOW (bruto)</span><span>' + eur(waarde) + '</span></label>' +
        '<input id="t1Schuif" type="range" min="0" max="' + max + '" step="500" value="' + waarde + '">' +
        '<small>Maximaal ' + eur(max) + ' per jaar in jouw situatie.</small></div>';
    }
    if (metTijdelijk) {
      html += '<div class="schuif"><label for="t2Schuif"><span>Hoeveel meer in die eerste jaren</span><span>' + s.tophlPct + '%</span></label>' +
        '<input id="t2Schuif" type="range" min="5" max="33" step="1" value="' + s.tophlPct + '">' +
        '<small>Tot 33% bovenop je levenslange pensioen.</small></div>';
    }
    return html + nav(RESULTAAT, 'Laat mijn pensioen zien');
  }

  // Stap 6: resultaat
  function schermResultaat() {
    var res = r();
    var eindLeeftijd = C.pensioenreglement.grafiekEindLeeftijd;
    var twee = res.u.t1 > 0 || res.u.t2 > 0;
    var html = coach('Dit is jouw pensioen met de keuzes die je hebt gemaakt. Alle bedragen zijn voorbeeldbedragen, geen advies.') +
      '<div class="resultaat"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<span style="color:var(--zacht)">Vanaf ' + res.tekst.pensioendatum + ' krijg je per maand</span>' +
      '<span style="display:flex;gap:8px;flex-wrap:wrap"><span class="wissel" role="group" aria-label="Bruto of netto">' +
      '<button type="button" data-basis="netto" aria-pressed="' + (s.basis === 'netto') + '">netto</button>' +
      '<button type="button" data-basis="bruto" aria-pressed="' + (s.basis === 'bruto') + '">bruto</button></span>' +
      '<span class="wissel" role="group" aria-label="Nominaal of reëel">' +
      '<button type="button" data-reeel="nom" aria-pressed="' + !res.reeel + '">nominaal</button>' +
      '<button type="button" data-reeel="reeel" aria-pressed="' + res.reeel + '">reëel</button></span></span></div>' +
      (s.reeel === null ? '<p class="tip" style="margin:8px 0 0;font-size:14px">' + K.reeelUitleg(res, false) + '</p>' : '') +
      '<div class="groot">' + eur(res.eerst) + '</div><div style="color:var(--zacht)">pensioen per maand, ' + eenheid(res) + (twee ? ', de eerste jaren' : '') + '</div>';

    // Fasebalk: breedte = aantal jaren, hoogte = bedrag.
    var startJ = res.jaar, aowJ = K.AOW_JAREN;
    var eindEerst = res.u.t2 > 0 ? res.eindKeuze / 12 : (res.u.t1 > 0 ? aowJ : startJ);
    var fasen = [];
    if (twee) fasen.push({ van: startJ, tot: eindEerst, bedrag: res.eerst, cls: '' });
    if (res.tussen !== null) fasen.push({ van: eindEerst, tot: aowJ, bedrag: res.tussen, cls: 'later' });
    var laterVan = res.tussen !== null ? aowJ : (twee ? eindEerst : startJ);
    fasen.push({ van: laterVan, tot: Math.max(eindLeeftijd, laterVan + 1), bedrag: res.later, cls: twee ? 'later' : '' });
    var hoogste = Math.max.apply(null, fasen.map(function (f) { return f.bedrag; })) || 1;
    html += '<div class="fasen" aria-hidden="true">' + fasen.map(function (f) {
      return '<div class="fase ' + f.cls + '" style="flex:' + Math.max(0.6, f.tot - f.van) + ';height:' + Math.max(12, 74 * f.bedrag / hoogste) + 'px"></div>';
    }).join('') + '</div><div class="fase-labels" aria-hidden="true">' + fasen.map(function (f, i) {
      var tot = i === fasen.length - 1 ? 'levenslang' : 'tot ' + K.leeftijdTekst(Math.round(f.tot * 12)).replace(' en 0 maanden', '');
      return '<div style="flex:' + Math.max(0.6, f.tot - f.van) + '"><strong>' + eur(f.bedrag) + '</strong><br>' + tot + '</div>';
    }).join('') + '</div>';

    var zinnen = [];
    zinnen.push('Je stopt met werken ' + res.tekst.stop + ', in ' + res.tekst.pensioendatum + '.');
    // Totaalbedragen per fase: netto van een los extra deel telt niet op tot het netto totaal.
    // Met beide keuzes stopt het tijdelijk hogere pensioen hier altijd op de AOW-datum (standaard einde), dus één zin.
    if (res.u.t1 > 0 && res.u.t2 > 0) zinnen.push('Met de AOW-overbrugging en het tijdelijk hogere pensioen samen krijg je tot je AOW ' + eur(res.eerst) + ' per maand. Daarna gaat je pensioen naar ' + eur(res.tussen !== null ? res.tussen : res.later) + ' per maand.');
    else if (res.u.t1 > 0) zinnen.push('Tot je AOW krijg je ' + eur(res.eerst) + ' per maand. Daarna gaat je pensioen naar ' + eur(res.later) + ' per maand.');
    else if (res.u.t2 > 0) zinnen.push('Tot ' + res.tekst.tophlEind + ' krijg je ' + eur(res.eerst) + ' per maand. Daarna is je pensioen ' + eur(res.tussen !== null ? res.tussen : res.later) + ' per maand.');
    if (!twee) zinnen.push('Je krijgt elke maand ongeveer hetzelfde bedrag, je hele leven lang.');
    zinnen.push('Samen met je AOW krijg je later ' + eur(res.laterInclAow) + ' per maand (' + eenheid(res) + ').');
    zinnen.push(res.partnerPct > 0 ? 'Als je overlijdt, krijgt je partner ' + eur(res.partner) + ' per maand (' + eenheid(res) + ').' : 'Je hebt geen partnerpensioen gekozen.');
    html += '<ul class="zinnen">' + zinnen.map(function (z) { return '<li>' + z + '</li>'; }).join('') + '</ul>';

    html += '<div class="wijzig"><span style="color:var(--zacht);align-self:center;font-size:15px">Iets anders proberen?</span>' +
      '<button type="button" data-naar="' + WANNEER + '">Stopmoment</button><button type="button" data-naar="' + PARTNER + '">Partner</button>' +
      '<button type="button" data-naar="' + VERDELING + '">Verdeling</button><button type="button" data-naar="' + DOEL + '">Wat ik belangrijk vind</button>' +
      '<button type="button" data-naar="' + WIE + '">Andere deelnemer</button></div></div>';

    var sig = signalen(res);
    html += '<h2>Let op bij jouw keuzes</h2>' + (sig.length
      ? '<div class="signalen">' + sig.map(function (g) {
          return '<div class="signaal' + (g.info ? ' info' : '') + '"><strong>' + g.titel + '</strong><p>' + g.tekst + '</p>' +
            (g.naar !== undefined ? '<button type="button" data-naar="' + g.naar + '">' + g.knop + '</button>' : '') + '</div>';
        }).join('') + '</div>'
      : '<div class="geen-signaal">We zien geen opvallende gevolgen in de combinatie van je keuzes.</div>');

    html += vergelijkSalaris();
    return html + nav(WATNU, 'Wat kan ik nu doen?');
  }

  // Salaris vlak vóór de pensioendatum naast het pensioen, in dezelfde weergave als de rest van het resultaat
  // (netto/bruto, nominaal/reëel). Het salaris stijgt tot dan met de loon-inflatie, net als in de rekenkern.
  function salarisEnPensioen() {
    var res = r();
    var rijen = res.sim.rows;
    var parttime = rijen.length ? rijen[rijen.length - 1].schema : 1;
    var j0 = Math.floor(K.E.maandIndex(C.calculatiedatum) / 12);
    var jaren = Math.max(0, Math.floor((res.pensIdx - 1) / 12) - j0);
    var salarisJaar = C.deelnemers[s.deelnemer].brutoSalaris * Math.pow(1 + C.rendement.loonInflatie, jaren) * parttime;
    var salaris = res.maand(salarisJaar, res.jaar);
    var aowJaar = C.aowBrutoMaand * 12;
    var fasen = [];
    if (res.voorAow) fasen.push({ label: 'Tot je AOW', bedrag: res.eerst, noot: 'zonder AOW' });
    else if (res.u.t2 > 0) fasen.push({ label: 'De eerste jaren', bedrag: res.maand(res.u.pre + aowJaar, res.jaar), noot: 'met AOW' });
    fasen.push({ label: res.voorAow || res.u.t2 > 0 ? 'Daarna, levenslang' : 'Levenslang', bedrag: res.laterInclAow, noot: 'met AOW' });
    fasen.forEach(function (f) { f.pct = salaris > 0 ? f.bedrag / salaris : 0; });
    return { res: res, salaris: salaris, salarisJaarBruto: res.reeel ? salarisJaar * res.reeelFactor(res.jaar) : salarisJaar, parttime: parttime, fasen: fasen };
  }

  function vergelijkSalaris() {
    var v = salarisEnPensioen();
    var max = Math.max.apply(null, [v.salaris].concat(v.fasen.map(function (f) { return f.bedrag; }))) || 1;
    function rij(cls, label, bedrag, sub) {
      return '<div class="vg-rij ' + cls + '"><span>' + label + '</span><span class="vg-balk"><i style="width:' + (100 * bedrag / max).toFixed(1) + '%"></i></span>' +
        '<span class="r">' + eur(bedrag) + '<small>' + sub + '</small></span></div>';
    }
    return '<h2>Vergeleken met je laatste salaris</h2>' +
      '<p class="tip" style="margin-top:0">Per maand, ' + eenheid(v.res) + '. Je laatste salaris vóór ' + v.res.tekst.pensioendatum + ' is ' +
      eur(v.salarisJaarBruto) + ' bruto per jaar' + (v.parttime < 1 ? ' (' + Math.round(v.parttime * 100) + '% parttime)' : '') +
      '. Zet het naast je vaste lasten van straks.</p>' +
      '<div class="vergelijk">' + rij('nu', 'Laatste salaris', v.salaris, '100%') +
      v.fasen.map(function (f) { return rij('', f.label, f.bedrag, Math.round(f.pct * 100) + '% · ' + f.noot); }).join('') + '</div>';
  }

  // Signalen bij (gestapelde) keuzes: wat valt op in de combinatie, met een stap om het aan te passen.
  // Bedragen in de gekozen weergave (netto/bruto, nominaal/reëel), net als de rest van het resultaat.
  function signalen(res) {
    var uit = [];
    var gelijk = K.bereken(keuzes({ topaow: 0, tophlPct: 0 }));
    var lagerLevenslang = gelijk.later - res.later;

    if (res.u.t1 > 0 && res.u.t2 > 0) {
      uit.push({ titel: 'Je stapelt twee manieren om eerst meer te krijgen',
        tekst: 'Met de AOW-overbrugging én het tijdelijk hogere pensioen krijg je tot je AOW ' + eur(res.eerst) + ' per maand. ' +
          'Daarna is je levenslange pensioen ' + eur(res.later) + ', dat is ' + eur(lagerLevenslang) + ' per maand minder dan bij gelijk verdelen. Dat verschil blijft je hele leven.' +
          (s.doel === 'zeker' ? ' Je gaf aan dat zekerheid voor later belangrijk is: past dit daarbij?' : ''),
        naar: VERDELING, knop: 'Verdeling aanpassen' });
    } else if ((res.u.t1 > 0 || res.u.t2 > 0) && res.eerst > 0 && 1 - res.later / res.eerst >= 0.2) {
      uit.push({ titel: 'Na de eerste jaren gaat je pensioen ' + Math.round((1 - res.later / res.eerst) * 100) + '% omlaag',
        tekst: 'Van ' + eur(res.eerst) + ' naar ' + eur(res.later) + ' per maand, zonder AOW. Met AOW wordt het ' + eur(res.laterInclAow) + '. Kun je dan je vaste lasten nog betalen?',
        naar: VERDELING, knop: 'Verdeling aanpassen' });
    }
    if (s.doel === 'zeker' && lagerLevenslang > 0.5 && !(res.u.t1 > 0 && res.u.t2 > 0)) {
      uit.push({ titel: 'Je vindt zekerheid voor later belangrijk',
        tekst: 'Met deze verdeling is je levenslange pensioen ' + eur(lagerLevenslang) + ' per maand lager dan bij gelijk verdelen. Past dat bij wat je wilt?',
        naar: VERDELING, knop: 'Verdeling aanpassen' });
    }
    if (res.voorAow && res.u.t1 === 0 && res.u.t2 === 0) {
      uit.push({ titel: 'Tot je AOW heb je alleen dit pensioen',
        tekst: 'Je stopt vóór je AOW-leeftijd. Tot je AOW krijg je ' + eur(res.eerst) + ' per maand, zonder AOW erbij.' +
          (s.bezit.spaar ? ' Je gaf aan spaargeld te hebben; dat kan meetellen in deze jaren.' : ' Je kunt die jaren ook overbruggen met een hoger bedrag.'),
        naar: VERDELING, knop: 'Bekijk de verdeling' });
    }
    if (s.partner === 'ja' && res.partnerPct === 0) {
      uit.push({ titel: 'Je hebt een partner, maar kiest geen partnerpensioen',
        tekst: 'Als je overlijdt, krijgt je partner van Fonds A niets. Bespreek dit samen, misschien is je partner op een andere manier goed verzorgd.',
        naar: PARTNER, knop: 'Partnerpensioen aanpassen' });
    }
    if (s.partner === 'nee' && res.partnerPct > 0) {
      var zonder = K.bereken(keuzes({ partnerPct: 0 }));
      uit.push({ info: true, titel: 'Je hebt geen partner, maar kiest wel partnerpensioen',
        tekst: 'Dat kost je ' + eur(zonder.eerst - res.eerst) + ' per maand. Het kan zinvol zijn als je later toch een partner krijgt; anders heb je het niet nodig.',
        naar: PARTNER, knop: 'Partnerpensioen aanpassen' });
    }
    var v = salarisEnPensioen();
    var levenslang = v.fasen[v.fasen.length - 1];
    if (levenslang.pct < GRENS_INKOMEN) {
      uit.push({ info: true, titel: 'Later heb je ' + Math.round(levenslang.pct * 100) + '% van je laatste salaris',
        tekst: 'Levenslang, met AOW, krijg je ' + eur(levenslang.bedrag) + ' per maand, tegen ' + eur(v.salaris) + ' salaris vlak voor je pensioen (' + eenheid(res) + ').' +
          (s.bezit.elders ? ' Je gaf aan ook pensioen bij een andere werkgever te hebben; dat komt hier nog bij.' : ' Kijk of je vaste lasten dan ook lager zijn.') });
    }
    return uit;
  }

  // Stap 7: wat nu? Concrete vervolgstappen en een samenvatting om te bewaren.
  function schermWatNu() {
    var res = r();
    var twee = res.u.t1 > 0 || res.u.t2 > 0;
    var acties = [];
    acties.push(['Bewaar je keuzes', 'Print deze pagina of sla hem op als pdf. Dan heb je je voorbeeldberekening bij de hand als je verder praat.']);
    if (s.partner === 'ja') acties.push(['Bespreek het met je partner', 'Vooral het partnerpensioen en de verdeling raken jullie allebei.']);
    acties.push(['Bekijk je hele pensioen', 'Op <a href="https://www.mijnpensioenoverzicht.nl" target="_blank" rel="noopener">mijnpensioenoverzicht.nl</a> zie je je AOW en het pensioen bij al je werkgevers.' +
      (s.bezit.elders ? ' Je gaf aan ook elders pensioen te hebben: tel dat mee.' : '')]);
    if (s.bezit.huis || s.bezit.spaar) {
      acties.push(['Zet je andere geld ernaast', 'Je gaf aan ' + [s.bezit.huis ? 'een eigen huis' : '', s.bezit.spaar ? 'spaargeld of beleggingen' : ''].filter(Boolean).join(' en ') +
        ' te hebben. Neem dat mee als je kiest hoe je je pensioen verdeelt.']);
    }
    acties.push(['Twijfel je? Vraag advies', 'Een financieel adviseur kan je hele situatie bekijken, ook wat buiten dit pensioen valt.']);
    acties.push(['Geef je keuzes op tijd door', 'In het echt kies je definitief vlak voor je pensioendatum. Tot die tijd kun je alles nog veranderen.' +
      (twee ? ' Omdat je eerst meer krijgt, stuurt Fonds A je ruim voordat je pensioen lager wordt een herinnering.' : '')]);

    var samen = [
      ['Deelnemer', esc(C.deelnemers[s.deelnemer].naam)],
      ['Stoppen met werken', res.tekst.stop + ', ' + res.tekst.pensioendatum],
      ['Partnerpensioen', res.partnerPct + '%'],
      ['Verdeling', res.u.t1 > 0 && res.u.t2 > 0 ? 'AOW-overbrugging en tijdelijk hoger pensioen' : res.u.t1 > 0 ? 'AOW-overbrugging' : res.u.t2 > 0 ? 'Tijdelijk hoger pensioen (' + Math.round(res.pctHL * 100) + '%)' : 'Gelijk verdeeld'],
      ['Pensioen vanaf ' + res.tekst.pensioendatum, eur(res.eerst) + ' per maand (' + eenheid(res) + ')'],
      ['Later, met AOW', eur(res.laterInclAow) + ' per maand (' + eenheid(res) + ')']
    ];

    var html = coach('Je hebt nu een beeld van je pensioen. Dit zijn de stappen die je daarna kunt zetten. Het blijft een voorbeeldberekening, geen advies.') +
      '<h1>Wat kun je nu doen?</h1><ol class="acties">' +
      acties.map(function (a, i) { return '<li data-nr="' + (i + 1) + '"><strong>' + a[0] + '</strong><span>' + a[1] + '</span></li>'; }).join('') + '</ol>' +
      '<h2>Jouw keuzes op een rij</h2><div class="resultaat"><ul class="samenvatting">' +
      samen.map(function (x) { return '<li><span>' + x[0] + '</span><span>' + x[1] + '</span></li>'; }).join('') + '</ul>' +
      '<p class="geen-print" style="margin:18px 0 0"><button class="knop" type="button" data-print>Print of bewaar als pdf</button></p></div>';
    return html + nav();
  }

  var SCHERMEN = [schermWie, schermDoel, schermWanneer, schermPartner, schermVerdeling, schermResultaat, schermWatNu];

  var getekendeStap = -1;
  function teken(focus) {
    // Alleen bij een nieuwe stap de inloop-animatie; een keuze binnen dezelfde stap tekent stil opnieuw.
    $('podium').innerHTML = '<div class="scherm' + (stap !== getekendeStap ? ' nieuw' : '') + '">' + SCHERMEN[stap]() + '</div>';
    getekendeStap = stap;
    var v = '';
    for (var i = 0; i < STAPPEN; i++) v += '<i class="' + (i <= stap ? 'klaar' : '') + '"></i>';
    $('voortgang').innerHTML = v;
    var pil = $('pil');
    if (stap >= WANNEER && stap <= VERDELING) {
      var res = r();
      pil.hidden = false;
      pil.innerHTML = '<span>Jouw pensioen nu</span><strong>' + eur(res.eerst) + '</strong><span>per maand, ' + eenheid(res) + '</span>';
    } else pil.hidden = true;
    if (focus) { var h = $('podium').querySelector('h1, .groot'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } window.scrollTo(0, 0); }
  }

  // Bij een schuif alleen opnieuw tekenen en de focus op de schuif houden.
  function tekenSchuif(id) {
    teken(false);
    var el = $(id);
    if (el) el.focus();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.hasAttribute('data-naar')) { stap = Number(b.getAttribute('data-naar')); teken(true); return; }
    if (b.hasAttribute('data-print')) { window.print(); return; }
    if (b.hasAttribute('data-doel')) { s.doel = b.getAttribute('data-doel'); teken(false); return; }
    if (b.hasAttribute('data-heeftpartner')) { s.partner = b.getAttribute('data-heeftpartner'); teken(false); return; }
    if (b.hasAttribute('data-bezit')) { var bz = b.getAttribute('data-bezit'); s.bezit[bz] = !s.bezit[bz]; teken(false); return; }
    if (b.hasAttribute('data-deelnemer')) {
      s.deelnemer = Number(b.getAttribute('data-deelnemer'));
      // Stopleeftijd die voor deze deelnemer niet meer kan: terug naar de AOW-leeftijd.
      if (s.start === 'ander' && K.leeftijden(s.deelnemer).indexOf(s.leeftijd) < 0) s.start = 'aow';
      s.topaow = 'max';
      s.reeel = null;
      teken(false); return;
    }
    if (b.hasAttribute('data-start')) { s.start = 'aow'; teken(false); return; }
    if (b.hasAttribute('data-leeftijd')) { s.start = 'ander'; s.leeftijd = Number(b.getAttribute('data-leeftijd')); s.topaow = 'max'; teken(false); return; }
    if (b.hasAttribute('data-partner')) {
      s.partnerKeuze = b.getAttribute('data-partner');
      s.partnerPct = s.partnerKeuze === 'max' ? C.partnerpensioen.maxPct : (s.partnerKeuze === 'geen' ? 0 : Math.round(C.partnerpensioen.maxPct / 2));
      teken(false); return;
    }
    if (b.hasAttribute('data-verdeling')) {
      var v = b.getAttribute('data-verdeling');
      if (v === 'gelijk') { s.overbrug = false; s.tijdelijk = false; }
      if (v === 'overbrug') { s.overbrug = !s.overbrug; s.topaow = 'max'; }
      if (v === 'tijdelijk') s.tijdelijk = !s.tijdelijk;
      teken(false); return;
    }
    if (b.hasAttribute('data-basis')) { s.basis = b.getAttribute('data-basis'); teken(false); return; }
    if (b.hasAttribute('data-reeel')) { s.reeel = b.getAttribute('data-reeel') === 'reeel'; teken(false); return; }
  });
  // Tijdens het slepen alleen de waarde en het meelopende bedrag bijwerken; bij loslaten alles opnieuw tekenen.
  function leesSchuif(t) {
    if (t.id === 'partnerSchuif') { s.partnerPct = Number(t.value); return s.partnerPct + '%'; }
    if (t.id === 't1Schuif') { s.topaow = Number(t.value) >= Number(t.max) ? 'max' : Number(t.value); return eur(Number(t.value)); }
    if (t.id === 't2Schuif') { s.tophlPct = Number(t.value); return s.tophlPct + '%'; }
    return null;
  }
  document.addEventListener('input', function (e) {
    var tekst = leesSchuif(e.target);
    if (tekst === null) return;
    e.target.parentNode.querySelector('label span:last-child').textContent = tekst;
    var strong = $('pil').querySelector('strong');
    if (strong) strong.textContent = eur(r().eerst);
  });
  document.addEventListener('change', function (e) {
    if (leesSchuif(e.target) !== null) tekenSchuif(e.target.id);
  });

  teken(false);
})();
</script>
</body>
</html>
