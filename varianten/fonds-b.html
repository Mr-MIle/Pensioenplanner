<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="fondsB.paginatitel">Fonds B · Pensioendashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@500;600&display=swap">
<link rel="stylesheet" href="balk.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1422; --vlak: #13203a; --vlak2: #1a2a47; --lijn: #24365a; --tekst: #e6edf7; --zacht: #8ea2c0;
    --op: #3ec5c1; --t1: #a98bf0; --t2: #e8b04a; --aow: #6f86ab; --werk: #3a4d6e; --partner: #f07f8f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .kop { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--lijn); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: .02em; }
  .logo .merk { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, var(--op), #2a7fd4); color: #06101e; font-weight: 700; }
  .kop .titel { color: var(--zacht); }
  .reeel-uitleg { color: var(--zacht); font-size: 12px; flex: 1; min-width: 0; }
  .logo, .kop .titel { white-space: nowrap; }
  .kop .rechts { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .seg { display: inline-flex; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--zacht); font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--vlak2); color: var(--tekst); }
  .seg button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--op); outline-offset: 2px; }
  .raster { display: grid; grid-template-columns: 330px 1fr; gap: 20px; padding: 20px 24px 40px; max-width: 1440px; margin: 0 auto; }
  @media (max-width: 980px) { .raster { grid-template-columns: 1fr; } }
  .paneel { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 12px; padding: 16px 18px; }
  .paneel h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); }
  .stuur { display: grid; gap: 18px; align-content: start; }
  .regel { display: grid; gap: 6px; }
  .regel .boven { display: flex; justify-content: space-between; gap: 8px; }
  .regel label { font-weight: 500; }
  .regel .waarde { color: var(--op); }
  .regel small { color: var(--zacht); font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--op); }
  input[type=range]:disabled { opacity: .35; }
  select { width: 100%; background: var(--vlak2); color: var(--tekst); border: 1px solid var(--lijn); border-radius: 8px; padding: 8px 10px; font: inherit; }
  .scheiding { border: 0; border-top: 1px solid var(--lijn); margin: 0; }
  .hoofd { display: grid; gap: 20px; align-content: start; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1200px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 12px; padding: 14px 16px; border-top: 3px solid var(--kleur, var(--op)); }
  .kpi .label { color: var(--zacht); font-size: 12px; }
  .kpi .getal { font-size: 28px; font-weight: 500; margin: 4px 0 2px; }
  .kpi .sub { color: var(--zacht); font-size: 12px; }
  .grafiek svg { display: block; width: 100%; height: auto; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; color: var(--zacht); font-size: 12px; }
  .legenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
  .twee { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 1200px) { .twee { grid-template-columns: 1fr; } }
  .verdeelbalk { display: flex; height: 26px; border-radius: 6px; overflow: hidden; margin: 4px 0 14px; background: var(--vlak2); }
  .verdeelbalk div { background: var(--c); min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 7px 0; border-bottom: 1px solid var(--lijn); text-align: left; font-weight: 400; }
  th { color: var(--zacht); font-size: 12px; }
  td.r, th.r { text-align: right; }
  td .stip { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 8px; }
  tr.totaal td { border-bottom: 0; font-weight: 600; }
  .pm-groep { border-bottom: 1px solid var(--lijn); }
  .pm-groep summary { padding: 10px 0; color: var(--tekst); font-size: 13px; font-weight: 600; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
  .pm-groep summary::-webkit-details-marker { display: none; }
  .pm-groep summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--zacht); border-bottom: 1.5px solid var(--zacht); transform: rotate(-45deg); transition: transform .15s; }
  .pm-groep[open] summary::before { transform: rotate(45deg); }
  .pm-groep table { margin-bottom: 10px; }
  .pm-groep tr:last-child td { border-bottom: 0; }
  .noot { color: var(--zacht); font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
<div class="vbalk" role="region" data-i18n-attr="aria-label:balk.label">
  <span class="vb-tag" data-i18n="balk.tag"></span>
  <span class="vb-naam" data-i18n="balk.b"></span>
  <span class="vb-noot" data-i18n="balk.noot"></span>
  <span class="vb-rechts">
    <nav data-i18n-attr="aria-label:balk.varianten"><a href="fonds-a.html">A</a><a href="fonds-b.html" aria-current="page">B</a><a href="fonds-c.html">C</a></nav>
    <a class="vb-link" href="index.html" data-i18n="balk.alle"></a>
    <a class="vb-link" href="../index.html" data-i18n="balk.terug"></a>
    <span data-taalknop></span>
  </span>
</div>

<header class="kop">
  <div class="logo"><span class="merk" aria-hidden="true">B</span> Fonds B</div>
  <span class="titel" data-i18n="fondsB.titel"></span>
  <span class="reeel-uitleg" id="reeelUitleg"></span>
  <div class="rechts">
    <span class="seg" role="group" data-i18n-attr="aria-label:gemeen.brutoOfNetto">
      <button type="button" data-basis="netto" aria-pressed="true" data-i18n="gemeen.Netto"></button>
      <button type="button" data-basis="bruto" aria-pressed="false" data-i18n="gemeen.Bruto"></button>
    </span>
    <span class="seg" role="group" data-i18n-attr="aria-label:gemeen.nominaalOfReeel">
      <button type="button" data-reeel="nom" aria-pressed="true" data-i18n="gemeen.Nominaal"></button>
      <button type="button" data-reeel="reeel" aria-pressed="false" data-i18n="gemeen.Reeel"></button>
    </span>
  </div>
</header>

<div class="raster">
  <aside class="paneel stuur" data-i18n-attr="aria-label:fondsB.keuzes">
    <h2 data-i18n="fondsB.deelnemer"></h2>
    <div class="regel" style="margin-top:-12px">
      <select id="deelnemer" data-i18n-attr="aria-label:fondsB.deelnemer"></select>
      <small id="deelnemerInfo" class="num"></small>
    </div>
    <hr class="scheiding">
    <h2 data-i18n="fondsB.keuzes"></h2>
    <div class="regel" style="margin-top:-12px">
      <div class="boven"><label for="leeftijd" data-i18n="fondsB.stopleeftijd"></label><span class="waarde num" id="leeftijdW"></span></div>
      <input id="leeftijd" type="range" step="1">
      <small id="leeftijdS"></small>
    </div>
    <div class="regel">
      <div class="boven"><label for="partner" data-i18n="fondsB.partner"></label><span class="waarde num" id="partnerW"></span></div>
      <input id="partner" type="range" step="5">
      <small data-i18n="fondsB.partnerUitleg"></small>
    </div>
    <div class="regel">
      <div class="boven"><label for="topaow" data-i18n="fondsB.topaow"></label><span class="waarde num" id="topaowW"></span></div>
      <input id="topaow" type="range" min="0" step="100" value="0">
      <small id="topaowS"></small>
    </div>
    <div class="regel">
      <div class="boven"><label for="tophl" data-i18n="fondsB.tophl"></label><span class="waarde num" id="tophlW"></span></div>
      <input id="tophl" type="range" min="0" step="1" value="0">
      <small id="tophlS"></small>
    </div>
    <div class="regel">
      <div class="boven"><label for="tophlEind" data-i18n="fondsB.tophlEind"></label><span class="waarde num" id="tophlEindW"></span></div>
      <input id="tophlEind" type="range" step="1">
      <small id="tophlEindS"></small>
    </div>
  </aside>

  <main class="hoofd">
    <div class="kpis" id="kpis"></div>
    <section class="paneel grafiek" aria-labelledby="h-inkomen">
      <h2 id="h-inkomen" data-i18n="fondsB.hInkomen"></h2>
      <div id="grafiek"></div>
      <div class="legenda">
        <span style="--c: var(--werk)" data-i18n="fondsB.lgWerk"></span>
        <span style="--c: var(--op)" data-i18n="fondsB.lgOp"></span>
        <span style="--c: var(--t1)">TOPAOW</span>
        <span style="--c: var(--t2)">TOPHL</span>
        <span style="--c: var(--aow)">AOW</span>
      </div>
    </section>
    <div class="twee">
      <section class="paneel" aria-labelledby="h-kapitaal">
        <h2 id="h-kapitaal" data-i18n="fondsB.hKapitaal"></h2>
        <div id="verdeling"></div>
      </section>
      <section class="paneel" aria-labelledby="h-param">
        <h2 id="h-param" data-i18n="fondsB.hParam"></h2>
        <div id="parameters"></div>
      </section>
    </div>
  </main>
</div>

<script src="../i18n/i18n.js"></script>
<script src="../i18n/nl.js"></script>
<script src="../i18n/en.js"></script>
<script src="../i18n/da.js"></script>
<script src="../config.js"></script>
<script src="../config-overlay.js"></script>
<script src="../engine.js"></script>
<script src="kern.js"></script>
<script>
(function () {
  'use strict';
  var K = window.VariantKern, C = K.C, I = K.I, t = K.t;
  var eur = K.eur;
  function $(id) { return document.getElementById(id); }
  // Rekenparameters per onderwerp, standaard ingeklapt. Wat de gebruiker openklapt blijft open bij het herberekenen.
  var groepOpen = {};
  function groep(sleutel, titel, rijen) {
    return '<details class="pm-groep" data-groep="' + sleutel + '"' + (groepOpen[sleutel] ? ' open' : '') + '><summary>' + titel +
      '</summary><table><tbody>' + rijen + '</tbody></table></details>';
  }
  function rij(label, waarde) { return '<tr><td>' + label + '</td><td class="r num">' + waarde + '</td></tr>'; }
  function pj(v) { return t('fondsB.perJaarKort', { bedrag: eur(v) }); }
  var basis = 'netto';
  var reeel = null;   // null = standaard: pensioendatum binnen 2 jaar nominaal, anders reëel
  var eindHandmatig = false;

  function vulDeelnemers() {
    var sel = $('deelnemer'), oud = sel.value;
    sel.innerHTML = '';
    C.deelnemers.forEach(function (d, i) {
      sel.add(new Option(K.naam(i) + ' · ' + t('kern.jaar', { n: K.deelnemer(i).leeftijdJaar }) + ' · ' + eur(d.startkapitaal), i));
    });
    sel.value = oud === '' ? C.standaardDeelnemer : oud;
  }

  function zetLeeftijdBereik() {
    var lijst = K.leeftijden(Number($('deelnemer').value));
    var sl = $('leeftijd');
    var oud = Number(sl.value);
    sl.min = lijst[0]; sl.max = lijst[lijst.length - 1];
    var std = C.pensioenreglement.standaardPensioenleeftijd;
    sl.value = lijst.indexOf(oud) >= 0 ? oud : (lijst.indexOf(std) >= 0 ? std : lijst[0]);
  }

  function keuzes() {
    var j = Number($('leeftijd').value);
    return {
      deelnemer: Number($('deelnemer').value),
      start: j === K.AOW_JAREN ? 'aow' : 'ander', leeftijd: j,
      partnerPct: Number($('partner').value),
      topaow: Number($('topaow').value) >= Number($('topaow').max) && Number($('topaow').max) > 0 ? 'max' : Number($('topaow').value),
      tophlPct: Number($('tophl').value),
      tophlEind: eindHandmatig ? Number($('tophlEind').value) : null,
      basis: basis, reeel: reeel
    };
  }

  function grafiek(res, eenheid) {
    var serie = K.jaarSerie(res);
    var W = 900, H = 300, L = 54, R = 10, T = 12, B = 30;
    var max = Math.max.apply(null, serie.map(function (d) { return d.w + d.op + d.t1 + d.t2 + d.a; })) || 1;
    var stap = max > 8000 ? 2000 : (max > 4000 ? 1000 : 500);
    var top = Math.ceil(max / stap) * stap;
    var bw = (W - L - R) / serie.length;
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('fondsB.grafiekLabel') + '">';
    for (var g = 0; g <= top; g += stap) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="#24365a"/>' +
        '<text x="' + (L - 8) + '" y="' + (y(g) + 4) + '" fill="#8ea2c0" font-size="11" text-anchor="end" font-family="IBM Plex Mono">' + I.getal(g / 1000, 0, 1) + 'k</text>';
    }
    var kleuren = [['w', '#3a4d6e'], ['op', '#3ec5c1'], ['t1', '#a98bf0'], ['t2', '#e8b04a'], ['a', '#6f86ab']];
    serie.forEach(function (d, i) {
      var x = L + i * bw + bw * 0.12, bww = bw * 0.76, acc = 0;
      svg += '<g><title>' + t('fondsB.staafTitel', { leeftijd: t('kern.jaar', { n: d.leeftijd }), bedrag: eur(d.totaal), eenheid: eenheid }) + '</title>';
      kleuren.forEach(function (k) {
        var v = d[k[0]];
        if (v <= 0) return;
        svg += '<rect x="' + x.toFixed(1) + '" y="' + y(acc + v).toFixed(1) + '" width="' + bww.toFixed(1) + '" height="' + (y(acc) - y(acc + v)).toFixed(1) + '" fill="' + k[1] + '"/>';
        acc += v;
      });
      svg += '</g>';
      if (d.leeftijd % 5 === 0) svg += '<text x="' + (x + bww / 2) + '" y="' + (H - 10) + '" fill="#8ea2c0" font-size="11" text-anchor="middle" font-family="IBM Plex Mono">' + d.leeftijd + '</text>';
    });
    // Markering van de pensioendatum en de AOW-leeftijd.
    [[res.jaar, t('fondsB.stop')], [K.AOW_JAREN, 'AOW']].forEach(function (m, n) {
      var idx = serie.findIndex(function (d) { return d.leeftijd >= Math.floor(m[0]); });
      if (idx < 0 || (n === 1 && Math.floor(m[0]) === Math.floor(res.jaar))) return;
      var x = L + idx * bw + (m[0] % 1) * bw;
      svg += '<line x1="' + x + '" x2="' + x + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#e6edf7" stroke-dasharray="3 4" opacity=".5"/>' +
        '<text x="' + (x + 4) + '" y="' + (T + 10) + '" fill="#e6edf7" font-size="11" opacity=".75">' + m[1] + '</text>';
    });
    return svg + '</svg>';
  }

  function kpi(kleur, label, getal, sub) {
    return '<div class="kpi" style="--kleur:' + kleur + '"><div class="label">' + label + '</div><div class="getal num">' + getal + '</div><div class="sub">' + sub + '</div></div>';
  }

  function render() {
    var res = K.bereken(keuzes());
    var u = res.u;
    var d = res.deelnemer;
    var rekendatum = I.datum(C.calculatiedatum);

    // Schuiven bijwerken op de grenzen van de rekenkern.
    var t1 = $('topaow');
    t1.max = res.maxT1;
    t1.disabled = res.maxT1 <= 0;
    var hl = $('tophl');
    hl.max = Math.round(C.tophl.maxPctOP * 100);
    hl.disabled = !res.tophlMogelijk;
    var eind = $('tophlEind');
    eind.disabled = !res.tophlMogelijk || u.t2 <= 0;
    if (res.tophlMogelijk) {
      eind.min = res.eindMinM; eind.max = res.eindMaxM;
      eind.value = res.eindKeuze;
    }

    $('deelnemerInfo').textContent = t('fondsB.deelnemerInfo', { geboren: I.datum(d.geboortedatum), salaris: eur(d.brutoSalaris), leeftijd: d.leeftijdJaar, datum: rekendatum });
    $('leeftijdW').textContent = t('kern.jaar', { n: res.jaar });
    $('leeftijdS').textContent = t(res.voorAow ? 'fondsB.datumVoorAow' : (res.pensM === K.AOW_M ? 'fondsB.datumOpAow' : 'fondsB.datumNaAow'), { datum: res.tekst.pensioendatum });
    $('partnerW').textContent = res.partnerPct + '%';
    $('topaowW').textContent = pj(u.t1);
    $('topaowS').textContent = res.maxT1 > 0 ? t('fondsB.topaowMax', { bedrag: eur(res.maxT1) }) : t('fondsB.topaowNiet');
    $('tophlW').textContent = Math.round(res.pctHL * 100) + '% · ' + pj(u.t2);
    $('tophlS').textContent = res.tophlMogelijk ? t('fondsB.tophlMax') : t('fondsB.tophlNiet');
    $('tophlEindW').textContent = res.tophlMogelijk ? K.leeftijdCompact(res.eindKeuze) : '–';
    $('tophlEindS').textContent = u.t2 > 0 ? (eindHandmatig ? res.tekst.tophlEind : t('fondsB.standaard', { tekst: res.tekst.tophlEind })) : t('fondsB.tophlEerst');

    document.querySelectorAll('[data-reeel]').forEach(function (o) { o.setAttribute('aria-pressed', String((o.getAttribute('data-reeel') === 'reeel') === res.reeel)); });
    $('reeelUitleg').textContent = K.reeelUitleg(res, reeel !== null);
    var eenheid = t('gemeen.' + basis) + (res.reeel ? ' · ' + t('gemeen.reeel') : '');

    var twee = u.t1 > 0 || u.t2 > 0;
    $('kpis').innerHTML =
      kpi('var(--op)', t('fondsB.kpiVanaf', { datum: res.tekst.pensioendatum }), eur(res.eerst), t(twee ? 'fondsB.kpiVanafSubTijdelijk' : 'fondsB.kpiVanafSub', { eenheid: eenheid })) +
      kpi('var(--aow)', t(twee ? 'fondsB.kpiDaarna' : 'fondsB.kpiLevenslang'), eur(twee ? res.later : res.laterInclAow),
        twee ? t('fondsB.kpiDaarnaSub', { bedrag: eur(res.laterInclAow), eenheid: eenheid }) : t('fondsB.kpiLevenslangSub', { eenheid: eenheid })) +
      kpi('var(--partner)', t('fondsB.partner'), eur(res.partner), t('fondsB.kpiPartnerSub', { pct: res.partnerPct, eenheid: eenheid })) +
      kpi('var(--t2)', t('fondsB.kpiKapitaal'), eur(res.kapitaal),
        res.reeel ? t('fondsB.kpiKapitaalReeel', { bedrag: eur(res.kapitaalNominaal) }) : t('fondsB.kpiKapitaalNominaal', { bedrag: eur(d.startkapitaal) }));

    $('grafiek').innerHTML = grafiek(res, eenheid);

    var v = res.verdeling;
    var totaal = v.levenslang + v.topaow + v.tophl + v.partner;
    var delen = [
      [t('fondsB.vdLevenslang'), v.levenslang, 'var(--op)'],
      [t('fondsB.vdTopaow'), v.topaow, 'var(--t1)'],
      [t('fondsB.vdTophl'), v.tophl, 'var(--t2)'],
      [t('fondsB.vdPartner'), v.partner, 'var(--partner)']
    ];
    $('verdeling').innerHTML = '<div class="verdeelbalk" aria-hidden="true">' + delen.map(function (p) {
      return '<div style="--c:' + p[2] + ';flex:' + Math.max(0, p[1]) + '"></div>';
    }).join('') + '</div><table><thead><tr><th>' + t('fondsB.vdOnderdeel') + '</th><th class="r">' + t('fondsB.vdKapitaal') + '</th><th class="r">' + t('fondsB.vdAandeel') + '</th></tr></thead><tbody>' +
      delen.map(function (p) {
        return '<tr><td><span class="stip" style="--c:' + p[2] + '"></span>' + p[0] + '</td><td class="r num">' + eur(p[1]) + '</td><td class="r num">' + I.getal(totaal ? p[1] / totaal * 100 : 0, 1, 2) + '%</td></tr>';
      }).join('') +
      '<tr class="totaal"><td>' + t('fondsB.vdTotaal', { datum: res.tekst.pensioendatum }) + '</td><td class="r num">' + eur(res.kapitaalNominaal) + '</td><td class="r num">100%</td></tr></tbody></table>';

    var o = res.overrendement;
    // Salaris en parttimepercentage op de rekendatum, zoals de rekenkern ze in de eerste maand gebruikt.
    var reg = C.pensioenreglement;
    var rij0 = res.sim.rows[0];
    var parttime = rij0 ? rij0.schema : 1;
    var wijzigtLater = res.sim.rows.some(function (r, i) { return i > 0 && r.wijziging; });
    var grondslag = Math.max(0, Math.min(d.brutoSalaris, reg.maxPensioengevendSalaris) - reg.franchise) * parttime;
    var pct3 = function (x) { return I.getal(x * 100, 3, 3) + '%'; };
    // Alle inkoopfactoren op de rekendatumschaal, net als de inkoopfactor OP (X%-projectie 21.1.10).
    var us = u.uitstel || 1;
    $('parameters').innerHTML =
      groep('deelnemer', t('fondsB.pmDeelnemer'),
      rij(t('fondsB.pmRekendatum'), rekendatum) +
      rij(t('fondsB.pmGeboortedatum'), I.datum(d.geboortedatum)) +
      rij(t('fondsB.pmLeeftijd'), K.leeftijdTekst(d.leeftijdMaanden)) +
      rij(t('fondsB.pmSalaris'), pj(d.brutoSalaris)) +
      rij(t(wijzigtLater ? 'fondsB.pmParttimeLater' : 'fondsB.pmParttime'), I.getal(parttime * 100, 0, 1) + '%') +
      rij(t('fondsB.pmStartkapitaal'), eur(d.startkapitaal))) +
      groep('actuarieel', t('fondsB.pmActuarieel'),
      rij(t('fondsB.pmInkoopOP', { leeftijd: t('kern.jaar', { n: res.jaar }) }), I.getal(res.aOP, 2, 2)) +
      rij(t('fondsB.pmInkoopNP'), I.getal(C.partnerpensioen.inkoopfactorNP * us, 2, 2)) +
      rij(t('fondsB.pmScrStart'), C.scr ? I.getal(C.scr.startwaarde, 3, 3) : '–') +
      rij(t('fondsB.pmScr', { n: C.scr ? C.scr.spreidingsperiode : '–' }), I.getal(u.scr, 4, 4)) +
      rij(t('fondsB.pmOpVoor'), pj(u.standaard)) +
      rij(t('fondsB.pmInkoopTopaow'), I.getal(C.topaow.inkoopfactor * us, 2, 2)) +
      rij(t('fondsB.pmLooptijdHL'), u.t2 > 0 ? t('fondsB.jrKort', { n: I.getal(u.looptijdHL, 1, 2) }) : '–') +
      rij(t('fondsB.pmInkoopHL', { factor: I.getal(C.tophl.inkoopfactorPerJaar * us, 2, 2) }), u.t2 > 0 ? I.getal(u.inkoopHL * us, 2, 2) : '–') +
      rij(t('fondsB.pmVerlaging'), u.R > 0 ? pj(u.R) : '–')) +
      groep('premie', t('fondsB.pmPremie'),
      rij(t('fondsB.pmFranchise'), pj(reg.franchise)) +
      rij(t('fondsB.pmGrondslag'), pj(grondslag)) +
      rij(t('fondsB.pmPremieRegel', { pct: I.getal(reg.premiepercentage * 100, 0, 1) }), pj(grondslag * reg.premiepercentage)) +
      rij(t('fondsB.pmNominaal'), pct3(o.nominaal)) +
      rij(t('fondsB.pmLooptijdRts', { aow: o.aowJaar, calc: o.calcJaar }), t('fondsB.jrKort', { n: o.looptijd })) +
      rij(t('fondsB.pmSpot', { n: Math.max(1, o.looptijd), datum: I.datum(C.rts.peildatum) }), '− ' + pct3(o.spot)) +
      '<tr class="totaal"><td>' + t('fondsB.pmOverrendement') + '</td><td class="r num">' + pct3(o.rente) + '</td></tr>' +
      // Per maand zoals de rekenkern bijschrijft: (1 + overrendement)^(1/12) − 1.
      '<tr class="totaal"><td>' + t('fondsB.pmOverrendementMaand') + '</td><td class="r num">' + I.getal((Math.pow(1 + o.rente, 1 / 12) - 1) * 100, 4, 4) + '%</td></tr>') +
      '<p class="noot">' + t('fondsB.pmNoot') + '</p>';
  }

  // toggle borrelt niet op: luister in de capture-fase.
  $('parameters').addEventListener('toggle', function (e) {
    var g = e.target.getAttribute && e.target.getAttribute('data-groep');
    if (g) groepOpen[g] = e.target.open;
  }, true);

  vulDeelnemers();
  zetLeeftijdBereik();
  $('partner').min = C.partnerpensioen.minPct;
  $('partner').max = C.partnerpensioen.maxPct;
  $('partner').value = C.partnerpensioen.standaardPct;

  $('deelnemer').addEventListener('change', function () { zetLeeftijdBereik(); eindHandmatig = false; reeel = null; $('topaow').value = 0; render(); });
  $('leeftijd').addEventListener('input', function () { eindHandmatig = false; render(); });
  $('tophlEind').addEventListener('input', function () { eindHandmatig = true; render(); });
  ['partner', 'topaow', 'tophl'].forEach(function (id) { $(id).addEventListener('input', render); });
  document.querySelectorAll('[data-reeel]').forEach(function (b) {
    b.addEventListener('click', function () { reeel = b.getAttribute('data-reeel') === 'reeel'; render(); });
  });
  document.querySelectorAll('[data-basis]').forEach(function (b) {
    b.addEventListener('click', function () {
      basis = b.getAttribute('data-basis');
      document.querySelectorAll('[data-basis]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      render();
    });
  });
  I.opWissel(function () { vulDeelnemers(); render(); });
  I.vertaal();
  render();
})();
</script>
</body>
</html>
