<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="overzicht.titel">Ontwerpvarianten · Pensioenplanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f2ec; --surface: #fffdf8; --fg: #1c2421; --muted: #5d6661; --line: #d9d5ca;
    --accent: #1f5c5a; --accent-soft: #e2eeec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #131917; --surface: #1b2321; --fg: #eef1ee; --muted: #a3ada8; --line: #33403c;
      --accent: #7fc3bf; --accent-soft: #213330;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 "Instrument Sans", system-ui, sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
  .boven { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .terug { color: var(--accent); font-weight: 600; text-decoration: none; }
  .terug:hover { text-decoration: underline; }
  .eyebrow { margin: 28px 0 6px; color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  h1 { font: 600 44px/1.1 "Newsreader", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
  h1, h2 { overflow-wrap: break-word; hyphens: auto; }   /* lange Deense en Engelse woorden op smalle schermen */
  @media (max-width: 600px) { h1 { font-size: 34px; } }
  .lead { max-width: 720px; margin: 0 0 10px; font-size: 18px; color: var(--muted); }
  .lead strong { color: var(--fg); }
  .feiten { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 36px; padding: 0; list-style: none; }
  .feiten li { padding: 6px 12px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 500; }
  .tegels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 900px) { .tegels { grid-template-columns: 1fr; } }
  .tegel {
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; color: inherit; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
  }
  .tegel:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(0,0,0,.35); }
  .tegel:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .tegel svg { display: block; width: 100%; height: auto; }
  .tegel .tekst { padding: 18px 20px 20px; display: grid; gap: 8px; flex: 1; }
  .tegel h2 { margin: 0; font: 600 24px/1.2 "Newsreader", Georgia, serif; }
  .tegel .principe { margin: 0; font-weight: 600; }
  .tegel p { margin: 0; color: var(--muted); font-size: 15px; }
  .tegel dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .tegel dt { color: var(--muted); }
  .tegel dd { margin: 0; }
  .tegel .open { margin-top: auto; padding-top: 10px; color: var(--accent); font-weight: 600; }
  .voet { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; max-width: 760px; }
</style>
</head>
