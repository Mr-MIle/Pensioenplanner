<script>
(function () {
  'use strict';
  var C = window.PLANNER_CONFIG;
  var E = window.PensioenEngine;
  var I = window.I18N, t = I.t;
  function $(id) { return document.getElementById(id); }
  function radio(name) { return document.querySelector('input[name="' + name + '"]:checked').value; }

  // Notatie volgt de gekozen taal (i18n/i18n.js); de valuta blijft de euro.
  var eur0 = { format: function (v) { return I.eur(v); } };
  var eur2 = { format: function (v) { return I.eur(v, 2); } };
  var pctFmt = { format: function (v) { return I.getal(v, 0, 1); } };

  var AOW_JAREN = C.pensioenreglement.aowLeeftijdMaanden / 12;
  function aowLabel() { return leeftijdTekst(C.pensioenreglement.aowLeeftijdMaanden); }

  var state = {};
  var huidigDeel = 0;
  // Einddatum van TOPHL: standaard volgt de regel; zodra de deelnemer zelf schuift, blijft die keuze staan.
  var tophlEindHandmatig = false;
  // Titel van optie 2 bij stap 1: neutraal tot de deelnemer zelf een leeftijd kiest, daarna met die leeftijd.
  var leeftijdGekozen = false;
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'tophlEind') tophlEindHandmatig = true;
  }, true);
  function leeftijdTekst(m) {
    var j = Math.floor(m / 12), r = m % 12;
    var jaar = t('kern.jaar', { n: j });
    return r ? t('kern.jaarEnMaanden', { jaar: jaar, maanden: t('kern.maanden', { n: r }) }) : jaar;
  }
  // Tekst voor een einddatum van TOPHL, als leeftijd in maanden. birthIdx is de geboortemaand als index.
  function eindTekst(birthIdx, m) {
    return t('kern.tophlEind', { datum: E.maandLabel(birthIdx + m), leeftijd: leeftijdTekst(m) });
  }
  var REEEL = false;
  // Standaard nominaal of reëel volgt de pensioendatum (zie render); na een klik op de schakelaar telt de eigen keuze, tot een reset.
  var reeelHandmatig = false;
  var REEEL_GRENS_MAANDEN = 24;
  var wijzigd = false, laatsteNom = null, vorigeNom = null;   // voor de stippellijn 'vorige keuze'   // één schakelaar voor alle bedragen: false = nominaal, true = reëel (euro's van vandaag)
  var laatsteBerekening = null;   // uitkomsten van de laatste render, voor de inkomenstijdlijn   // index van de gekozen deelnemer, voor de link naar bij-en-afschrijvingen
  var scenario = 'basis';   // basis | pess | opt: welk overrendement de kapitaalgrafiek en kapitaalcijfers gebruiken
  var parttimeRows = [];
  var MAX_WERK = 6;

  function parttimeLijst() {
    return parttimeRows
      .filter(function (r) { return r.vanaf; })
      .slice()
      .sort(function (a, b) { return E.maandIndex(a.vanaf) - E.maandIndex(b.vanaf); })
      .map(function (r) { return { vanaf: r.vanaf, percentage: r.pct }; });
  }

  function formatMaand(idx) {
    var j = Math.floor(idx / 12), m = idx % 12;
    return j + '-' + (m + 1 < 10 ? '0' + (m + 1) : String(m + 1));
  }

  function renderWerk() {
    var html = '';
    parttimeRows.forEach(function (r, i) {
      var opts = '';
      for (var p = 0; p <= 100; p += 5) {
        opts += '<option value="' + p + '"' + (p === r.pct ? ' selected' : '') + '>' + p + '%</option>';
      }
      html += '<div class="rij" style="gap: 8px">' +
        '<label class="muted" for="wv' + i + '">' + t('demo.werk.vanaf') + '</label>' +
        '<input id="wv' + i + '" type="month" data-i="' + i + '" data-f="vanaf" value="' + (r.vanaf || '') + '">' +
        '<label class="muted" for="wp' + i + '">' + t('demo.werk.pct') + '</label>' +
        '<select id="wp' + i + '" data-i="' + i + '" data-f="pct">' + opts + '</select>' +
        '<button class="link-knop" type="button" data-remove="' + i + '">' + t('demo.werk.verwijder') + '</button>' +
        '</div>';
    });
    $('parttimeLijst').innerHTML = html;
    $('parttimeVoegToe').disabled = parttimeRows.length >= MAX_WERK;
  }

  function parttimeVoegToe() {
    var laatste = parttimeRows.length ? parttimeRows[parttimeRows.length - 1] : null;
    var vanaf = laatste && laatste.vanaf ? formatMaand(E.maandIndex(laatste.vanaf) + 12) : '2029-01';
    parttimeRows.push({ vanaf: vanaf, pct: laatste ? laatste.pct : 80 });
    renderWerk();
    render();
  }

  function reset() {
    wijzigd = true;
    radioSet('start', 'aow');
    radioSet('deel', 'nee');
    vulLeeftijd();
    $('partnerPct').value = C.partnerpensioen.standaardPct;
    $('topaow').value = 0;
    $('tophl').value = 0;
    tophlEindHandmatig = false;
    leeftijdGekozen = false;
    reeelHandmatig = false;
    var std = C.pensioenreglement.standaardPensioenleeftijd;
    $('leeftijd').value = $('leeftijd').querySelector('option[value="' + std + '"]') ? std : $('leeftijd').options[0].value;
    $('deelPct').value = 40;
    parttimeRows = C.parttimepercentages.map(function (r) { return { vanaf: r.vanaf, pct: r.percentage }; });
    renderWerk();
    setBasis('netto');
    $('startkapitaal').value = C.deelnemer.startkapitaal;
    $('lhk').checked = true;
    render();
  }
  function radioSet(name, v) {
    document.querySelector('input[name="' + name + '"][value="' + v + '"]').checked = true;
  }

  // Datum "jjjj-mm-dd" voor weergave, in de notatie van de gekozen taal.
  function datumNl(s) { return I.datum(s); }

  // Naam van deelnemer i. De voorbeeldnamen 'Deelnemer A' tot 'Deelnemer D' volgen de taal.
  function deelnemerNaam(i) {
    var n = C.deelnemers[i].naam, m = /^Deelnemer ([A-Z])$/.exec(n);
    return m ? t('kern.deelnemer', { letter: m[1] }) : n;
  }

  // Keuzelijst pensioenleeftijd: alleen leeftijden die na de calculatiedatum liggen.
  // Met deeltijdpensioen is de leeftijd de ingangsdatum daarvan: 10 jaar tot 1 jaar vóór de AOW-leeftijd.
  function vulLeeftijd() {
    var sel = $('leeftijd');
    var birthIdx = E.maandIndex(C.deelnemer.geboortedatum);
    var calcIdx = E.maandIndex(C.calculatiedatum);
    var lo = 60;
    var hi = 70;
    var oud = sel.value;
    sel.innerHTML = '';
    for (var j = lo; j <= hi; j++) {
      if (birthIdx + j * 12 > calcIdx) sel.add(new Option(t('kern.jaar', { n: j }), j));
    }
    if (oud && sel.querySelector('option[value="' + oud + '"]')) sel.value = oud;
  }

  // Kies een demo-deelnemer: die wordt het uitgangspunt (geboortedatum, startkapitaal, salaris).
  function kiesDeelnemer(i) {
    wijzigd = true;
    C.deelnemer = Object.assign({}, C.deelnemers[i]);
    $('deelnemerKeuze').value = i;
    huidigDeel = i;
    vulLeeftijd();
    toonDeelnemerInfo();
    reset();
  }
  function toonDeelnemerInfo() {
    var maanden = E.maandIndex(C.calculatiedatum) - E.maandIndex(C.deelnemer.geboortedatum);
    $('deelnemerInfo').textContent = t('demo.deelnemerInfo', { datum: E.maandLabel(E.maandIndex(C.calculatiedatum)), leeftijd: leeftijdTekst(maanden) });
  }

  // Teksten die het script zelf invult en die bij een taalwissel opnieuw moeten.
  function vasteTeksten() {
    var dk = $('deelnemerKeuze'), oud = dk.value;
    dk.innerHTML = '';
    C.deelnemers.forEach(function (d, i) {
      dk.add(new Option(t('demo.optieDeelnemer', { naam: deelnemerNaam(i), geboren: datumNl(d.geboortedatum), kapitaal: eur0.format(d.startkapitaal) }), i));
    });
    if (oud !== '') dk.value = oud;
    $('kapDatum').textContent = E.maandLabel(E.maandIndex(C.calculatiedatum));
    zetToggleTekst();
  }
  function zetToggleTekst() {
    $('grafiekToggle').textContent = t($('tijdlijnPaneel').classList.contains('ingeklapt') ? 'demo.tl.toon' : 'demo.tl.verberg');
  }

  function init() {
    $('partnerPct').min = C.partnerpensioen.minPct;
    $('partnerPct').max = C.partnerpensioen.maxPct;

    I.vertaal();
    var dk = $('deelnemerKeuze');
    vasteTeksten();
    dk.addEventListener('change', function () { kiesDeelnemer(Number(dk.value)); });
    var dsel = $('deelPct');
    for (var p = 10; p <= 90; p += 10) dsel.add(new Option(p + '%', p));

    // Stappen openen en sluiten: één tegelijk open
    var knoppen = document.querySelectorAll('.stap-kop');
    knoppen.forEach(function (k) {
      k.addEventListener('click', function () {
        var open = k.getAttribute('aria-expanded') === 'true';
        knoppen.forEach(function (o) {
          o.setAttribute('aria-expanded', 'false');
          document.getElementById(o.getAttribute('aria-controls')).hidden = true;
        });
        if (!open) {
          k.setAttribute('aria-expanded', 'true');
          document.getElementById(k.getAttribute('aria-controls')).hidden = false;
        }
      });
    });

    document.querySelectorAll('.seg').forEach(function (b) {
      b.addEventListener('click', function () {
        scenario = b.getAttribute('data-sc');
        document.querySelectorAll('.seg').forEach(function (o) {
          var aan = o === b;
          o.classList.toggle('actief', aan);
          o.setAttribute('aria-pressed', aan ? 'true' : 'false');
        });
        render();
      });
    });

    document.querySelectorAll('[data-basis]').forEach(function (b) {
      b.addEventListener('click', function () {
        setBasis(b.getAttribute('data-basis'));
        render();
      });
    });

    $('toonGrens').addEventListener('change', function () {
      document.querySelectorAll('.grens').forEach(function (e) { e.hidden = !this.checked; }, this);
      renderTijdlijn();
    });

    $('vergelijk').addEventListener('click', function (e) {
      var b = e.target.closest('[data-plan]');
      if (b) { laadPlan(Number(b.getAttribute('data-plan'))); return; }
      var d = e.target.closest('[data-delete]');
      if (d) {
        var lijst = leesRuwe();
        lijst.splice(Number(d.getAttribute('data-delete')), 1);
        bewaarRuwe(lijst);
        renderVergelijk();
      }
    });
    $('planBewaar').addEventListener('click', bewaarScenario);
    $('planNaam').addEventListener('keydown', function (e) { if (e.key === 'Enter') bewaarScenario(); });
    $('planMelding').addEventListener('click', function (e) {
      if (!e.target.closest('[data-naar-scenarios]')) return;
      $('scenarioDetails').open = true;
      $('scenarioPaneel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Deeltijd en de pensioenleeftijd hangen samen: deeltijd vraagt een ingangsleeftijd tussen 57 en 66 jaar.
    document.querySelector('input[name="deel"][value="ja"]').addEventListener('change', function () { vulLeeftijd(); });
    document.querySelector('input[name="deel"][value="nee"]').addEventListener('change', function () { vulLeeftijd(); });
    document.querySelector('input[name="start"][value="aow"]').addEventListener('change', function () {
      radioSet('deel', 'nee');
      vulLeeftijd();
    });
    document.querySelector('input[name="start"][value="ander"]').addEventListener('change', function () { vulLeeftijd(); });
    // Vóór de algemene render-luisteraar hieronder, zodat de titel van optie 2 meteen de gekozen leeftijd toont.
    $('leeftijd').addEventListener('change', function () { leeftijdGekozen = true; });

    var inputs = document.querySelectorAll('input, select');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener('input', render);
      inputs[i].addEventListener('change', function () { wijzigd = true; render(); });
    }
    $('reset').addEventListener('click', reset);
    document.body.classList.add('met-sheet');
    if (window.matchMedia && window.matchMedia('(max-width: 879px)').matches) {
      $('tijdlijnPaneel').classList.add('ingeklapt');
      document.body.classList.add('sheet-ingeklapt');
      zetToggleTekst();
      $('grafiekToggle').setAttribute('aria-expanded', 'false');
    }
    $('grafiekToggle').addEventListener('click', function () {
      var dicht = $('tijdlijnPaneel').classList.toggle('ingeklapt');
      document.body.classList.toggle('sheet-ingeklapt', dicht);
      zetToggleTekst();
      this.setAttribute('aria-expanded', dicht ? 'false' : 'true');
    });
    document.querySelectorAll('[data-reeel]').forEach(function (b) {
      b.addEventListener('click', function () {
        REEEL = b.getAttribute('data-reeel') === 'reeel';
        reeelHandmatig = true;
        syncReeel();
        render();
      });
    });
    $('parttimeVoegToe').addEventListener('click', parttimeVoegToe);
    $('parttimeLijst').addEventListener('change', function (e) {
      var veld = e.target;
      var i = Number(veld.getAttribute('data-i'));
      if (!parttimeRows[i]) return;
      if (veld.getAttribute('data-f') === 'vanaf') parttimeRows[i].vanaf = veld.value;
      else parttimeRows[i].pct = Number(veld.value);
      wijzigd = true;
      renderWerk();
      render();
    });
    $('parttimeLijst').addEventListener('click', function (e) {
      var i = e.target.getAttribute && e.target.getAttribute('data-remove');
      if (i === null || i === undefined) return;
      parttimeRows.splice(Number(i), 1);
      wijzigd = true;
      renderWerk();
      render();
    });
    I.opWissel(function () {
      vasteTeksten();
      toonDeelnemerInfo();
      renderWerk();
      $('planMelding').textContent = '';
      render();
    });
    kiesDeelnemer(C.standaardDeelnemer);
  }

  function setBasis(v) {
    $('basis').value = v;
    document.querySelectorAll('[data-basis]').forEach(function (b) {
      var aan = b.getAttribute('data-basis') === v;
      b.classList.toggle('actief', aan);
      b.setAttribute('aria-pressed', aan ? 'true' : 'false');
    });
  }

  // Reële factor: 1 op de calculatiedatum, daarna daalt die met de prijsinflatie. Leeftijd in jaren.
  function reeelFactor(leeftijd) {
    var ageNow = (E.maandIndex(C.calculatiedatum) - E.maandIndex(C.deelnemer.geboortedatum)) / 12;
    return Math.pow(1 + C.rendement.inflatiePrijs, -Math.max(0, leeftijd - ageNow));
  }
  // Som van een maandveld over alle maanden: nominaal, of reëel met de factor per maand.
  function somBedrag(rows, veld) {
    return rows.reduce(function (a, r) { return a + r[veld] * (REEEL ? r.defl : 1); }, 0);
  }
  function syncReeel() {
    document.querySelectorAll('[data-reeel]').forEach(function (b) {
      var aan = b.getAttribute('data-reeel') === (REEEL ? 'reeel' : 'nom');
      b.classList.toggle('actief', aan);
      b.setAttribute('aria-pressed', aan ? 'true' : 'false');
    });
  }

  // Netto of bruto bedrag per maand, uit een jaarlijks bruto inkomen.
  // jaar = leeftijd waarop het bedrag wordt uitgekeerd; met reëel wordt het bedrag daarop omgerekend.
  function maand(jaarBruto, jaar) {
    var v = $('basis').value === 'netto' ? E.nettoJaar(C, jaarBruto, $('lhk').checked) / 12 : jaarBruto / 12;
    return REEEL && jaar !== undefined ? v * reeelFactor(jaar) : v;
  }

  function render() {
    var start = radio('start');
    var deelAan = radio('deel') === 'ja';
    var partnerPct = Number($('partnerPct').value);
    $('startAnder').hidden = start !== 'ander';
    $('optieAnderTitel').textContent = start === 'ander' && leeftijdGekozen
      ? t('demo.stap1.anderGekozen', { n: $('leeftijd').value }) : t('demo.stap1.ander');
    $('deelSub').hidden = !deelAan;
    $('partnerPctWaarde').textContent = partnerPct + '%';

    // Bij deeltijdpensioen gaat u volledig met pensioen op de AOW-datum.
    var gekozenJaar = start === 'aow' ? AOW_JAREN : Number($('leeftijd').value);
    var dLo = Math.round(AOW_JAREN) - 10, dHi = Math.round(AOW_JAREN) - 1;
    var deelGeldig = deelAan && start === 'ander' && gekozenJaar >= dLo && gekozenJaar <= dHi;
    // Met deeltijd loopt het volledige pensioen door tot de AOW-datum. De gekozen leeftijd blijft de ingangsdatum van het deeltijdpensioen.
    var jaar = deelGeldig ? AOW_JAREN : gekozenJaar;
    var pensMaanden = Math.round(jaar * 12);
    var gekozenMaanden = Math.round(gekozenJaar * 12);
    var calcIdx = E.maandIndex(C.calculatiedatum);
    var birthIdx = E.maandIndex(C.deelnemer.geboortedatum);
    var pensIdx = birthIdx + pensMaanden;
    var voorAow = pensMaanden < C.pensioenreglement.aowLeeftijdMaanden;

    // Standaardweergave: pensioendatum (bij deeltijd de ingangsdatum daarvan) binnen 2 jaar na de calculatiedatum
    // toont nominale bedragen, verder weg reële bedragen. Een eigen keuze met de schakelaar blijft staan.
    var maandenTotPensioen = birthIdx + gekozenMaanden - calcIdx;
    if (!reeelHandmatig) {
      var reeelStd = maandenTotPensioen > REEEL_GRENS_MAANDEN;
      if (REEEL !== reeelStd) { REEEL = reeelStd; syncReeel(); }
      $('reeelUitleg').textContent = t(REEEL ? 'demo.reeelStd' : 'demo.nominaalStd');
    } else {
      $('reeelUitleg').textContent = '';
    }

    // Deeltijd
    var deel = null;
    var melding = '';
    if (deelAan) {
      if (start !== 'ander') {
        melding = t('demo.deel.meldingAow');
      } else if (!deelGeldig) {
        melding = t('demo.deel.meldingBereik', { lo: dLo, hi: dHi });
      } else {
        deel = { idx: birthIdx + gekozenMaanden, pct: Number($('deelPct').value) / 100 };
      }
    }
    $('melding').textContent = melding;
    $('melding').hidden = !melding;

    var orr = E.overrendement(C);
    var rente = orr.rente;
    var wl = parttimeLijst();
    var sk = Math.max(0, Number($('startkapitaal').value) || 0);
    var marge = E.scenarioMarge(C, pensMaanden);
    var sim = E.simuleer(C, { pensioenLeeftijdMaanden: pensMaanden, rente: rente, deeltijd: deel, parttimepercentages: wl, startkapitaal: sk });
    var simLo = E.simuleer(C, { pensioenLeeftijdMaanden: pensMaanden, rente: rente - marge, deeltijd: deel, parttimepercentages: wl, startkapitaal: sk });
    var simHi = E.simuleer(C, { pensioenLeeftijdMaanden: pensMaanden, rente: rente + marge, deeltijd: deel, parttimepercentages: wl, startkapitaal: sk });
    // AOW-overbrugging (TOPAOW): alleen vóór de AOW-leeftijd. De werkfractie op de pensioendatum bepaalt het maximum.
    // TOPHL: van de pensioendatum tot een gekozen eerste van de maand, uiterlijk 10 jaar na de AOW-leeftijd.
    var aowM = C.pensioenreglement.aowLeeftijdMaanden;
    var eindMaxM = aowM + C.tophl.jarenNaAOW * 12;
    var eindMinM = pensMaanden + 1;
    var tophlMogelijk = eindMinM <= eindMaxM;
    var eindStdM = voorAow ? aowM : eindMaxM;
    $('topaowSub').hidden = !voorAow;
    $('verdeelMelding').hidden = voorAow;
    $('tophlSub').hidden = !tophlMogelijk;
    $('tophlEindSub').hidden = !tophlMogelijk;
    var werkfractie = sim.rows.length ? sim.rows[sim.rows.length - 1].werk : 1;
    var maxT1 = E.uitkeringen(C, sim, { partnerPct: partnerPct, topaow: Infinity, werkfractie: werkfractie }, jaar).maxT1;
    var maxHeel = Math.floor(maxT1);
    var slT1 = $('topaow');
    slT1.max = maxHeel;
    slT1.disabled = maxHeel <= 0;
    if (Number(slT1.value) > maxHeel) slT1.value = maxHeel;
    var sl1 = Math.max(0, Number(slT1.value) || 0);
    // Op de schuifmaximum-stand gebruikt de rekenkern het exacte maximum.
    var topT1 = maxHeel > 0 && sl1 >= maxHeel ? maxT1 : sl1;
    var slT2 = $('tophl');
    slT2.disabled = !tophlMogelijk;
    if (!tophlMogelijk) slT2.value = 0;
    var pctHL = Math.max(0, Number(slT2.value) || 0) / 100;
    var slE = $('tophlEind');
    if (tophlMogelijk) {
      slE.min = eindMinM;
      slE.max = eindMaxM;
      if (!tophlEindHandmatig) slE.value = eindStdM;
      else slE.value = Math.min(eindMaxM, Math.max(eindMinM, Number(slE.value)));
    }
    slE.disabled = !tophlMogelijk;
    var eindKeuze = tophlMogelijk ? Number(slE.value) : null;
    var tOpt = { partnerPct: partnerPct, topaow: topT1, tophlPct: pctHL, tophlEindMaanden: eindKeuze, werkfractie: werkfractie };

    var u = E.uitkeringen(C, sim, tOpt, jaar);
    var lo = E.uitkeringen(C, simLo, tOpt, jaar);
    var hi = E.uitkeringen(C, simHi, tOpt, jaar);

    $('topaowWaarde').textContent = t('demo.perJaar', { bedrag: eur0.format(maxHeel > 0 && sl1 >= maxHeel ? maxHeel : sl1) });
    $('topaowMax').textContent = maxHeel > 0
      ? t('demo.topaow.max', { bedrag: eur0.format(maxHeel) })
      : t(voorAow ? 'demo.topaow.geenRuimte' : 'demo.topaow.alleenVoor');
    $('tophlWaarde').textContent = Math.round(pctHL * 100) + '%' + (u.t2 > 0 ? ' (' + t('demo.perJaar', { bedrag: eur0.format(u.t2) }) + ')' : '');
    $('tophlMax').textContent = !tophlMogelijk
      ? t('demo.tophl.niet')
      : t('demo.tophl.max', { bedrag: eur0.format(C.tophl.maxPctOP * u.opNa) });
    if (tophlMogelijk) {
      $('tophlEindWaarde').textContent = eindTekst(birthIdx, eindKeuze);
      var basisEind = t('demo.tophl.eindUitleg');
      var standaardEind = t(voorAow ? 'demo.tophl.stdAow' : 'demo.tophl.stdNa');
      $('tophlEindUitleg').textContent = basisEind + (tophlEindHandmatig ? '' : ' ' + standaardEind);
    } else {
      $('tophlEindWaarde').textContent = '';
      $('tophlEindUitleg').textContent = '';
    }
    // Kapitaal van het gekozen scenario (basis, pessimistisch of optimistisch).
    var selSim = scenario === 'pess' ? simLo : (scenario === 'opt' ? simHi : sim);
    var pct2 = function (v) { return I.getal(v * 100, 2, 2); };
    $('scenarioRente').textContent = t('demo.kap.rente', { nominaal: pct2(orr.nominaal), spot: pct2(orr.spot), looptijd: orr.looptijd, aowJaar: orr.aowJaar,
      basis: pct2(rente), pess: pct2(rente - marge), opt: pct2(rente + marge) });

    var pensLabel = E.maandLabel(birthIdx + gekozenMaanden);
    var deelJaar = u.deelJaar;
    var preJaar = u.pre + deelJaar;
    var postJaar = u.post + deelJaar;

    // Werkwijzigingen: melding en samenvatting
    var wMeld = '';
    var wsorted = wl;
    var seen = {};
    wl.forEach(function (r) {
      if (seen[r.vanaf]) wMeld = t('demo.werk.dubbel');
      seen[r.vanaf] = true;
      if (E.maandIndex(r.vanaf) > pensIdx - 1) wMeld = wMeld || t('demo.werk.naPensioen');
    });
    $('parttimeMelding').textContent = wMeld;
    $('parttimeMelding').hidden = !wMeld;
    $('kW').textContent = wsorted.length
      ? wsorted.map(function (r) { return t('demo.werk.samenvatting', { pct: r.percentage, datum: E.maandLabel(E.maandIndex(r.vanaf)) }); }).join(' · ')
      : t('demo.werk.geen');

    // Stap-samenvattingen
    $('k1').textContent = start === 'aow' ? t('demo.k1Aow', { leeftijd: aowLabel() }) : t('demo.k1', { n: jaar });
    $('k2').textContent = deelGeldig ? t('demo.k2Deels', { pct: $('deelPct').value, n: Number($('leeftijd').value) }) : t('demo.k2Volledig');
    $('k3').textContent = partnerPct > 0 ? t('demo.k3', { pct: partnerPct }) : t('demo.k3Geen');
    $('k4').textContent = u.t1 > 0 ? t('demo.k4', { bedrag: eur0.format(u.t1) }) : t('demo.k4Geen');
    $('k5').textContent = u.t2 > 0 ? t('demo.k5', { pct: Math.round(pctHL * 100), datum: E.maandLabel(birthIdx + eindKeuze) }) : t('demo.k5Geen');

    // Resultaatpaneel
    // Overzicht: totaal tot de AOW-leeftijd (levenslang OP + tijdelijk), totaal vanaf de AOW-leeftijd (levenslang OP) en partnerpensioen.
    var basisNu = t('gemeen.' + $('basis').value);
    var sterk = function (v) { return '<strong>' + eur0.format(v) + '</strong>'; };
    var bedragPens = u.pre;                                  // jaarbedrag op de pensioendatum
    var bedragAow = E.jaarlijkseUitkering(u, aowM);          // jaarbedrag op de AOW-leeftijd
    var bedragNa = voorAow ? bedragAow : u.post;            // levenslang bedrag na de fase met TOPAOW en TOPHL
    var eindTxt = u.t2 > 0 ? eindTekst(birthIdx, eindKeuze) : '';
    var tussenJaar = u.t2 > 0 && voorAow && eindKeuze < aowM ? E.jaarlijkseUitkering(u, eindKeuze) : null;
    var aowJaar = C.aowBrutoMaand * 12;
    $('nettoUitleg').hidden = $('basis').value !== 'netto';
    if (deel) {
      $('rVoorBlok').hidden = false;
      $('rVoorLabel').textContent = t('demo.res.deelLabel', { datum: E.maandLabel(deel.idx) });
      $('rVoor').textContent = eur0.format(maand(deelJaar, gekozenJaar));
      $('rVoorSub').textContent = t('demo.res.deelSub', { basis: basisNu, pct: Math.round(deel.pct * 100) }) +
        (u.t2 > 0 ? ' ' + t('demo.res.tophlLoopt', { eind: eindTxt }) : '');
      $('rVoorDetail').innerHTML = '';
      $('rNaLabel').textContent = t('demo.res.naDeelLabel', { leeftijd: aowLabel() });
      $('rNa').textContent = eur0.format(maand(u.post + deelJaar, AOW_JAREN));
      $('rNaSub').innerHTML = t('demo.res.levenslang', { basis: basisNu }) +
        '<div class="uitsplitsing"><div>' + t('demo.res.opRegel', { bedrag: sterk(maand(u.post, AOW_JAREN)) }) + '</div>' +
        '<div>' + t('demo.res.deelRegelKort', { bedrag: sterk(maand(deelJaar, gekozenJaar)) }) + '</div></div>' +
        t('demo.res.inclAow', { bedrag: sterk(maand(u.post + deelJaar + aowJaar, AOW_JAREN)), basis: basisNu });
    } else {
      $('rVoorBlok').hidden = !(voorAow || u.t2 > 0);
      $('rVoorLabel').textContent = voorAow
        ? t('demo.res.totaalTotAow', { datum: pensLabel })
        : t(u.t2 > 0 ? 'demo.res.vanafTophl' : 'demo.res.vanaf', { datum: pensLabel });
      $('rVoor').textContent = eur0.format(maand(bedragPens, gekozenJaar));
      $('rVoorSub').textContent = t('demo.res.perMaand', { basis: basisNu }) + (u.t2 > 0 ? '. ' + t('demo.res.tophlLoopt', { eind: eindTxt }) : '');
      var detail = '<div>' + t('demo.res.opNaRegel', { bedrag: sterk(maand(u.opNa, gekozenJaar)) }) + '</div>';
      if (u.t1 > 0) detail += '<div>' + t('demo.res.topaowRegel', { bedrag: sterk(maand(u.t1, gekozenJaar)) }) + '</div>';
      if (u.t2 > 0) detail += '<div>' + t('demo.res.tophlRegel', { eind: eindTxt, bedrag: sterk(maand(u.t2, gekozenJaar)) }) + '</div>';
      $('rVoorDetail').innerHTML = detail;
      if (voorAow) $('rNaLabel').textContent = t('demo.res.vanafAow', { leeftijd: aowLabel() });
      else if (u.t2 > 0) $('rNaLabel').textContent = t('demo.res.naTophl', { datum: E.maandLabel(birthIdx + eindKeuze) });
      else $('rNaLabel').textContent = t('demo.res.vanaf', { datum: pensLabel });
      $('rNa').textContent = eur0.format(maand(bedragNa, AOW_JAREN));
      var naSub = t('demo.res.levenslang', { basis: basisNu });
      if (u.t2 > 0 && eindKeuze > aowM) naSub += ' (' + t('demo.res.tophlLooptNog', { eind: eindTxt }) + ')';
      if (tussenJaar !== null) naSub += '<br>' + t('demo.res.tussen', { bedrag: sterk(maand(tussenJaar, AOW_JAREN)), basis: basisNu });
      $('rNaSub').innerHTML = naSub + '<br>' + t('demo.res.inclAow', { bedrag: sterk(maand(bedragNa + aowJaar, AOW_JAREN)), basis: basisNu });
    }

    $('rDeel').textContent = deel ? t('demo.res.deelRegel', { datum: E.maandLabel(deel.idx), bedrag: eur0.format(maand(deelJaar, gekozenJaar)) }) : '';
    $('rPartner').innerHTML = '<div class="label">' + t('demo.res.partnerLabel') + '</div>' +
      (partnerPct === 0
        ? '<div class="sub-tekst">' + t('demo.res.partnerGeen') + '</div>'
        : '<div class="bedrag-klein">' + t('demo.res.partnerBedrag', { bedrag: eur0.format(maand(u.partner, gekozenJaar)), basis: basisNu }) + '</div>' +
          '<div class="sub-tekst">' + t('demo.res.partnerUitleg', { pct: partnerPct }) + '</div>');

    $('potLink').href = 'bij-en-afschrijvingen.html?d=' + huidigDeel;

    // Kapitaal
    var kapNom = selSim.kapitaal, kapReeelWaarde = selSim.kapitaal / selSim.inflIdx;
    var kapReeelModus = REEEL;
    $('kKapitaal').textContent = eur0.format(kapReeelModus ? kapReeelWaarde : kapNom);
    $('kKapitaalReeel').textContent = kapReeelModus ? t('demo.kap.nominaalBedrag', { bedrag: eur0.format(kapNom) }) : t('demo.kap.reeelBedrag', { bedrag: eur0.format(kapReeelWaarde) });
    $('kInleg').textContent = eur0.format(somBedrag(selSim.rows, 'inleg'));
    $('kInlegSub').textContent = t('demo.kap.overBedrag', { bedrag: eur0.format(somBedrag(selSim.rows, 'over')) });
    var pv = Math.min(C.partnerpensioen.maxPct, Math.max(C.partnerpensioen.minPct, partnerPct)) / 100;
    var aOPv = E.inkoopfactorVoor(jaar, C.inkoopfactorenOP);
    var perMaand = function (eind) { return naarBasis(eind / (aOPv + pv * C.partnerpensioen.inkoopfactorNP) / 12); };
    var toonK = true, toonP = false; var kapRe = REEEL;   // de planner toont alleen het kapitaal
    $('grafiek').innerHTML = tekenVermogen(selSim.rows, sk, {
      toonKapitaal: toonK,
      toonPensioen: toonP,
      pensioen: selSim.rows.map(function (r) { return perMaand(r.eind); }),
      pensLo: simLo.rows.map(function (r) { return perMaand(r.eind); }),
      pensHi: simHi.rows.map(function (r) { return perMaand(r.eind); }),
      reeel: kapRe,
      kapLo: simLo.rows.map(function (r) { return r.eind * (kapRe ? r.defl : 1); }),
      kapHi: simHi.rows.map(function (r) { return r.eind * (kapRe ? r.defl : 1); })
    });
    $('legendaKapitaal').hidden = !toonK;
    $('legKapStip').textContent = t(kapRe ? 'demo.kap.nominaalTotaal' : 'demo.kap.reeelTotaal');

    // Maandtabel: altijd nominaal, met de reële eindwaarde in een eigen kolom. Volgt de nominaal/reëel-schakelaar niet.
    var somNom = function (veld) { return sim.rows.reduce(function (a, r) { return a + r[veld]; }, 0); };
    $('tInleg').textContent = eur0.format(somNom('inleg'));
    $('tOver').textContent = eur0.format(somNom('over'));
    $('tabel').innerHTML = sim.rows.map(function (r) {
      var k = 1;
      return '<tr class="' + (r.wijziging ? 'wijz' : '') + '">' +
        '<td>' + r.maand + '</td>' +
        '<td>' + r.leeftijd + '</td>' +
        '<td>' + Math.round(r.werk * 100) + '%</td>' +
        '<td>' + eur0.format(r.begin * k) + '</td>' +
        '<td>' + eur2.format(r.inleg * k) + '</td>' +
        '<td>' + eur2.format(r.over * k) + '</td>' +
        '<td>' + I.getal(rente * r.toed * 100, 2, 2) + '%</td>' +
        '<td>' + (r.onttrokken ? eur0.format(r.onttrokken * k) : '–') + '</td>' +
        '<td>' + eur0.format(r.eind * k) + '</td>' +
        '<td>' + eur0.format(r.reeel) + '</td>' +
        '</tr>';
    }).join('');
    laatsteBerekening = { sim: sim, u: u, pensIdx: pensIdx, startIdx: birthIdx + gekozenMaanden, birth: birthIdx, deelIdx: deel ? deel.idx : null, deelJaar: u.deelJaar };
    renderVergelijk();
    renderTijdlijn();
  }

  // Per kalenderjaar het gemiddelde maandbedrag: werkinkomen, ouderdomspensioen (incl. deeltijd), TOPAOW, TOPHL en AOW.
  // Het eerste jaar telt vanaf de calculatiedatum, het laatste tot de eindleeftijd van de grafiek; het gemiddelde is over
  // de maanden die in de grafiek vallen. Netto via dezelfde belastingtabel als de rest van de planner.
  // Per jaar: jaar (kalenderjaar), leeftijd (de leeftijd die in dat jaar wordt bereikt) en lft (leeftijd midden in het jaar, voor reëel).
  function jaarSerie(o) {
    var calcIdx = E.maandIndex(C.calculatiedatum);
    var j0 = Math.floor(calcIdx / 12);
    var eindIdx = o.birth + C.pensioenreglement.grafiekEindLeeftijd * 12;
    var aowIdx = o.birth + C.pensioenreglement.aowLeeftijdMaanden;
    var li = C.rendement.loonInflatie;
    var salaris = C.deelnemer.brutoSalaris;
    var basis = $('basis').value;
    var lhk = $('lhk').checked;
    var rowMap = {};
    o.sim.rows.forEach(function (r, k) { rowMap[calcIdx + k] = r; });

    var jaren = {};
    for (var i = calcIdx; i < eindIdx; i++) {
      var jaar = Math.floor(i / 12);
      var g = jaren[jaar] || (jaren[jaar] = { w: 0, op: 0, t1: 0, t2: 0, a: 0, n: 0 });
      var row = rowMap[i];
      if (i < o.pensIdx && row) g.w += salaris * Math.pow(1 + li, Math.floor(i / 12) - j0) / 12 * row.werk;
      if (o.deelIdx !== null && i >= o.deelIdx) g.op += o.deelJaar / 12;
      if (i >= o.pensIdx) {
        var ageM = i - o.birth;
        var t1m = ageM < o.u.aowM ? o.u.t1 : 0;
        var t2m = ageM < o.u.eindM ? o.u.t2 : 0;
        g.t1 += t1m / 12;
        g.t2 += t2m / 12;
        g.op += (E.jaarlijkseUitkering(o.u, ageM) - t1m - t2m) / 12;
      }
      if (i >= aowIdx) g.a += C.aowBrutoMaand;
      g.n++;
    }

    return Object.keys(jaren).map(Number).sort(function (a, b) { return a - b; }).map(function (k) {
      var g = jaren[k];
      var w = g.w / g.n, op = g.op / g.n, t1 = g.t1 / g.n, t2 = g.t2 / g.n, a = g.a / g.n;
      var bruto = w + op + t1 + t2 + a;
      var netto = bruto > 0 ? E.nettoJaar(C, bruto * 12, lhk) / 12 : 0;
      var f = basis === 'netto' ? (bruto > 0 ? netto / bruto : 0) : 1;
      return { jaar: k, leeftijd: k - Math.floor(o.birth / 12), lft: (k * 12 + 6 - o.birth) / 12,
        w: w * f, op: op * f, t1: t1 * f, t2: t2 * f, a: a * f, totaal: bruto * f };
    });
  }

  function renderTijdlijn() {
    var L = laatsteBerekening;
    if (!L) return;
    var serieNom = jaarSerie({ sim: L.sim, u: L.u, pensIdx: L.pensIdx, birth: L.birth, deelIdx: L.deelIdx, deelJaar: L.deelJaar });
    // Vorige keuze: het totaal van de toestand vóór de laatste wijziging, als stippellijn.
    var huidigNom = {};
    serieNom.forEach(function (s) { huidigNom[s.jaar] = s.totaal; });
    // Alleen bij een afgeronde wijziging (veld verlaten) schuift de stippellijn op.
    if (wijzigd) { vorigeNom = laatsteNom; laatsteNom = huidigNom; wijzigd = false; }
    var vorigeMap = null;
    if (vorigeNom) {
      vorigeMap = {};
      Object.keys(vorigeNom).forEach(function (k) { vorigeMap[k] = vorigeNom[k] * (REEEL ? reeelFactor((Number(k) * 12 + 6 - L.birth) / 12) : 1); });
    }
    var serie = serieNom;
    if (REEEL) {
      serie = serie.map(function (s) {
        var f = reeelFactor(s.lft);
        return { jaar: s.jaar, leeftijd: s.leeftijd, lft: s.lft, w: s.w * f, op: s.op * f, t1: s.t1 * f, t2: s.t2 * f, a: s.a * f, totaal: s.totaal * f };
      });
    }
    var aowIdx = L.birth + C.pensioenreglement.aowLeeftijdMaanden;
    if (!serie.length) return;

    var piek = serie[0];
    serie.forEach(function (s) { if (s.totaal > piek.totaal) piek = s; });
    var grens = 0.7 * piek.totaal;
    // Dalen tellen pas vanaf het hoogste punt: de lagere startjaren komen door de salarisgroei, niet door de overgang.
    var na = serie.filter(function (s) { return s.jaar > piek.jaar && s.totaal > 0; });
    var aowLeeftijd = Math.floor(C.pensioenreglement.aowLeeftijdMaanden / 12);
    var dal = na.filter(function (s) { return s.totaal < grens; });

    var noot = dal.length
      ? t('demo.tl.dal', { van: dal[0].jaar, tot: dal[dal.length - 1].jaar, lftVan: dal[0].leeftijd, lftTot: dal[dal.length - 1].leeftijd })
      : t('demo.tl.geenDal');
    $('tijdlijnNoot').textContent = ($('toonGrens').checked ? noot + ' ' : '') + t('demo.tl.noot');
    $('tijdlijnGrafiek').innerHTML = tekenTijdlijn(serie, L, grens, aowLeeftijd, dal, vorigeMap);
  }

  function tekenTijdlijn(serie, L, grens, aowLeeftijd, dal, vorigeMap) {
    var W = 720, H = 344, pl = 76, pr = 16, pt = 56, pb = 48;
    var top = 0;
    serie.forEach(function (s) { top = Math.max(top, s.totaal); });
    if (vorigeMap) { Object.keys(vorigeMap).forEach(function (k) { top = Math.max(top, vorigeMap[k]); }); }
    var as = uitkeringsAs(top || 1);
    top = as.top;
    var slot = (W - pl - pr) / serie.length;
    var bw = slot * 0.72;
    var eerste = serie[0].jaar;
    var x1 = W - pr;
    function y(v) { return H - pb - (H - pt - pb) * v / top; }
    // Elke kolom is een kalenderjaar; een maandindex staat op zijn plek binnen dat jaar.
    function xMaand(m) { return Math.min(x1, Math.max(pl, pl + slot * (m / 12 - eerste))); }

    // Alleen de jaren na het hoogste punt onder de 70% krijgen de achtergrond, zoals de noot en de legenda zeggen.
    var toon = $('toonGrens').checked;
    var inDal = {};
    if (toon) dal.forEach(function (s) { inDal[s.jaar] = true; });

    // Fasen als achtergrondzones: Werken, Deeltijd, Pensioen en AOW, met de grenzen op de maand van de overgang.
    // Deeltijd loopt van de ingangsdatum tot de volledige pensioendatum (pensIdx); daarna is het pensioen volledig.
    // Gaat het pensioen pas na de AOW in, dan volgt de AOW-zone direct op het werken.
    var aowIdx = L.birth + C.pensioenreglement.aowLeeftijdMaanden;
    var heeftDeel = L.deelIdx !== null && L.deelIdx !== undefined;
    var beginIdx = eerste * 12, eindIdx = (serie[serie.length - 1].jaar + 1) * 12;
    var grenzen = [
      { z: 'werken', van: beginIdx, tot: heeftDeel ? L.deelIdx : L.pensIdx },
      { z: 'deeltijd', van: heeftDeel ? L.deelIdx : L.pensIdx, tot: L.pensIdx },
      { z: 'pensioen', van: L.pensIdx, tot: aowIdx },
      { z: 'aow', van: Math.max(L.pensIdx, aowIdx), tot: eindIdx }
    ];
    var zoneStijl = {
      werken: 'fill:color-mix(in srgb, var(--accent) 4%, transparent)',
      deeltijd: 'fill:color-mix(in srgb, var(--accent) 16%, transparent)',
      pensioen: 'fill:color-mix(in srgb, var(--warm) 16%, transparent)',
      aow: 'fill:color-mix(in srgb, var(--muted) 16%, transparent)'
    };
    var zones = '';
    grenzen.forEach(function (r) {
      var van = Math.max(r.van, beginIdx), tot = Math.min(r.tot, eindIdx);
      if (tot <= van) return;
      var zx0 = xMaand(van), zx1 = xMaand(tot);
      zones += '<rect x="' + zx0.toFixed(2) + '" y="0" width="' + (zx1 - zx0).toFixed(2) + '" height="' + (H - pb) + '" style="' + zoneStijl[r.z] + '"/>';
      // Lang label ('Werken tot jan 2045') als er ruimte is, anders alleen de fase.
      var lang = t('demo.tl.zone.' + r.z + 'Lang', { datum: E.maandLabel(r.z === 'werken' ? tot : van) });
      var label = zx1 - zx0 >= 130 ? lang : (zx1 - zx0 >= 58 ? t('demo.tl.zone.' + r.z) : '');
      if (label) zones += '<text class="as zone" x="' + (zx0 + 6).toFixed(1) + '" y="18">' + label + '</text>';
    });

    var grid = '';
    for (var tick = 0; tick <= top + as.stap / 2; tick += as.stap) {
      grid += '<line class="raster" x1="' + pl + '" x2="' + x1 + '" y1="' + y(tick).toFixed(1) + '" y2="' + y(tick).toFixed(1) + '"/>';
      grid += '<text class="as" x="' + (pl - 10) + '" y="' + (y(tick) + 4).toFixed(1) + '" text-anchor="end">' + eur0.format(tick) + '</text>';
    }

    var body = '';
    serie.forEach(function (s, k) {
      var sx = pl + slot * k;
      if (inDal[s.jaar]) {
        body += '<rect x="' + sx.toFixed(2) + '" y="' + pt + '" width="' + slot.toFixed(2) + '" height="' + (H - pt - pb) + '" fill="var(--warn-bg)"/>';
      }
      var acc = 0;
      [['w', 'var(--accent)', t('demo.tl.tipWerk')], ['op', 'var(--warm)', t('demo.tl.tipOp')], ['t1', 'var(--topaow)', t('demo.tl.tipTopaow')], ['t2', 'var(--tophl)', t('demo.tl.tipTophl')], ['a', 'var(--muted)', 'AOW']].forEach(function (d) {
        var v = s[d[0]];
        if (v <= 0) return;
        var ya = y(acc), yb = y(acc + v);
        body += '<rect x="' + (sx + (slot - bw) / 2).toFixed(2) + '" y="' + yb.toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + (ya - yb).toFixed(2) +
          '" fill="' + d[1] + '" stroke="var(--surface)" stroke-width="1"><title>' + t('demo.tl.tip', { jaar: s.jaar, leeftijd: s.leeftijd, naam: d[2], bedrag: eur0.format(v), totaal: eur0.format(s.totaal) }) + '</title></rect>';
        acc += v;
      });
    });

    // Drempel van 70% van het hoogste inkomen, met label rechts boven de lijn.
    var drempelSvg = '<line x1="' + pl + '" x2="' + x1 + '" y1="' + y(grens).toFixed(1) + '" y2="' + y(grens).toFixed(1) + '" stroke="var(--fg)" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>' +
      '<text class="as" x="' + x1 + '" y="' + (y(grens) - 6).toFixed(1) + '" text-anchor="end">' + t('demo.tl.grensKort') + '</text>';
    var drempel = toon ? drempelSvg : '';

    var basis = '<line x1="' + pl + '" x2="' + x1 + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" stroke="var(--muted)" stroke-width="1"/>';

    var ax = '';
    // Kalenderjaar op de as, met daaronder de leeftijd die in dat jaar wordt bereikt.
    serie.forEach(function (s, k) {
      if (s.jaar % 5 === 0 || k === 0) {
        var ax0 = (pl + slot * k + slot / 2).toFixed(1);
        ax += '<text class="as" x="' + ax0 + '" y="' + (H - 24) + '" text-anchor="middle">' + s.jaar + '</text>' +
          '<text class="as" x="' + ax0 + '" y="' + (H - 8) + '" text-anchor="middle" opacity=".7">' + t('demo.tl.lftKort', { n: s.leeftijd }) + '</text>';
      }
    });

    var ghost = '';
    if (vorigeMap) {
      var gp = [];
      serie.forEach(function (s, k) {
        var v = vorigeMap[s.jaar];
        if (v !== undefined) gp.push((pl + slot * k + slot / 2).toFixed(1) + ',' + y(v).toFixed(1));
      });
      if (gp.length) ghost = '<polyline points="' + gp.join(' ') + '" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/>';
    }
    // Markeringen bij de pensioendatum en de AOW-datum, op de maand zelf. De fasenamen staan in de zones, dus hier alleen de lijn.
    function marker(m) {
      if (m <= beginIdx || m >= eindIdx) return '';
      var x = xMaand(m);
      return '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (pt - 10) + '" y2="' + (H - pb) + '" stroke="var(--fg)" stroke-dasharray="2 3" opacity=".6"/>';
    }
    var lijnen = marker(aowIdx) + (L.pensIdx !== aowIdx ? marker(L.pensIdx) : '');

    return '<svg class="grafiek" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('demo.tl.aria') + '">' +
      zones + grid + body + drempel + basis + ax + ghost + lijnen + '</svg>';
  }

  // Zelf bewaarde scenario's, in de browser (localStorage). Ruwe lijst, zoals opgeslagen.
  function leesRuwe() {
    try {
      var a = JSON.parse(window.localStorage.getItem('pensioenplanner.plannen.v1') || '[]');
      if (!Array.isArray(a)) return [];
      return a.filter(function (p) {
        return p && typeof p.naam === 'string' && Array.isArray(p.parttime) && (p.start === 'aow' || p.start === 'ander');
      });
    } catch (e) { return []; }
  }
  function bewaarRuwe(lijst) {
    try { window.localStorage.setItem('pensioenplanner.plannen.v1', JSON.stringify(lijst)); } catch (e) {}
  }
  function opgeslagenPlannen() {
    return leesRuwe().map(function (p) { return Object.assign({ deel: false, deelPct: 50, partnerPct: C.partnerpensioen.standaardPct, topaow: 0, tophl: 0 }, p); });
  }

  // Bewaar de keuzes uit de invoer onder een eigen naam. Een bestaande naam wordt overschreven.
  // Deelnemer en startkapitaal horen niet bij een scenario: die gelden altijd zoals ze op het scherm staan.
  function bewaarScenario() {
    var naam = $('planNaam').value.trim();
    if (!naam) { $('planMelding').textContent = t('demo.bewaar.geenNaam'); $('planNaam').focus(); return; }
    var lijst = leesRuwe();
    var p = huidigeKeuzes(naam);
    p.opgeslagen = new Date().toISOString().slice(0, 10);
    var i = lijst.findIndex(function (o) { return o.naam.toLowerCase() === naam.toLowerCase(); });
    if (i >= 0) lijst[i] = p; else lijst.push(p);
    bewaarRuwe(lijst);
    $('planMelding').innerHTML = t(i >= 0 ? 'demo.bewaar.bijgewerkt' : 'demo.bewaar.opgeslagen', { naam: esc(naam) }) +
      ' <button class="link-knop" type="button" data-naar-scenarios>' + t('demo.bewaar.bekijk') + '</button>';
    $('scenarioDetails').open = true;
    renderVergelijk();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  // De huidige keuzes uit de wizard, als plan.
  function huidigeKeuzes(naam) {
    return {
      naam: naam,
      start: radio('start'),
      leeftijd: Number($('leeftijd').value),
      deel: radio('deel') === 'ja',
      deelPct: $('deelPct').value,
      parttime: parttimeLijst().map(function (r) { return { vanaf: r.vanaf, percentage: r.percentage }; }),
      partnerPct: Number($('partnerPct').value),
      topaow: Number($('topaow').value),
      tophl: Number($('tophl').value),
      tophlEind: tophlEindHandmatig ? Number($('tophlEind').value) : null
    };
  }

  // Uitkomsten van één plan, met dezelfde regels als de wizard.
  function planUitkomst(p, rente, sk) {
    var birthIdx = E.maandIndex(C.deelnemer.geboortedatum);
    var gekozenJaar = p.start === 'aow' ? AOW_JAREN : Number(p.leeftijd);
    var dLo = Math.round(AOW_JAREN) - 10, dHi = Math.round(AOW_JAREN) - 1;
    // Deeltijd alleen met een ingangsleeftijd tussen 10 jaar en 1 jaar vóór de AOW. Met de AOW-leeftijd als keuze is er geen deeltijd.
    var deelGeldig = !!p.deel && p.start === 'ander' && gekozenJaar >= dLo && gekozenJaar <= dHi;
    var jaar = deelGeldig ? AOW_JAREN : gekozenJaar;
    var pensM = Math.round(jaar * 12);
    var pensIdx = birthIdx + pensM;
    var voorAow = pensM < C.pensioenreglement.aowLeeftijdMaanden;
    var deel = deelGeldig ? { idx: birthIdx + Math.round(gekozenJaar * 12), pct: Number(p.deelPct) / 100 } : null;
    var partnerPct = Number(p.partnerPct);
    var sim = E.simuleer(C, { pensioenLeeftijdMaanden: pensM, rente: rente, deeltijd: deel, parttimepercentages: p.parttime, startkapitaal: sk });
    var werk = sim.rows.length ? sim.rows[sim.rows.length - 1].werk : 1;
    var maxT1 = E.uitkeringen(C, sim, { partnerPct: partnerPct, topaow: Infinity, werkfractie: werk }, jaar).maxT1;
    var maxHeel = Math.floor(maxT1);
    var sl1 = voorAow && maxHeel > 0 ? Math.min(Math.max(0, Number(p.topaow) || 0), maxHeel) : 0;
    var opMax = maxHeel > 0 && sl1 >= maxHeel;
    var t1 = opMax ? maxT1 : sl1;
    var hl = Math.max(0, Number(p.tophl) || 0) / 100;
    var eindM = p.tophlEind !== null && p.tophlEind !== undefined ? Number(p.tophlEind) : undefined;
    var u = E.uitkeringen(C, sim, { partnerPct: partnerPct, topaow: t1, tophlPct: hl, tophlEindMaanden: eindM, werkfractie: werk }, jaar);
    return {
      naam: p.naam,
      pensLabel: E.maandLabel(pensIdx),
      pensJaar: jaar,
      pl: maand(u.pre),
      na: maand(voorAow ? E.jaarlijkseUitkering(u, C.pensioenreglement.aowLeeftijdMaanden) : u.post),
      t1: u.t1,
      t2: u.t2,
      pctHL: hl,
      kapitaal: sim.kapitaal
    };
  }

  // Zet een opgeslagen scenario in de invoer. Daarna rekent de hele pagina met de keuzes van dat scenario,
  // voor de deelnemer en het startkapitaal die nu op het scherm staan.
  function laadPlan(i) {
    var p = opgeslagenPlannen()[i];
    if (!p) return;
    wijzigd = true;
    radioSet('start', p.start);
    radioSet('deel', p.deel ? 'ja' : 'nee');
    if (p.start === 'ander' && $('leeftijd').querySelector('option[value="' + p.leeftijd + '"]')) { $('leeftijd').value = String(p.leeftijd); leeftijdGekozen = true; }
    $('deelPct').value = p.deelPct;
    $('partnerPct').value = p.partnerPct;
    parttimeRows = p.parttime.map(function (r) { return { vanaf: r.vanaf, pct: r.percentage }; });
    // Het maximum wordt in render bepaald; eerst de bovengrens openen, anders klemt de browser de waarde af.
    $('topaow').max = 100000;
    $('topaow').value = p.topaow;
    $('tophl').value = p.tophl;
    tophlEindHandmatig = p.tophlEind !== null && p.tophlEind !== undefined;
    $('tophlEind').max = 100000;
    if (tophlEindHandmatig) $('tophlEind').value = p.tophlEind;
    renderWerk();
    render();
    $('planNaam').value = p.naam;
    $('planMelding').textContent = t('demo.bewaar.geladen', { naam: p.naam });
    document.querySelector('.invoer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function naarBasis(m) {
    if (m === null || m === undefined) return null;
    return $('basis').value === 'netto' ? E.nettoJaar(C, m * 12, $('lhk').checked) / 12 : m;
  }

  function renderVergelijk() {
    var rente = E.overrendement(C).rente;
    var sk = Math.max(0, Number($('startkapitaal').value) || 0);
    var lijst = opgeslagenPlannen();
    $('scenarioAantal').textContent = lijst.length ? t('demo.sc.aantal', { n: lijst.length }) : t('demo.sc.nogLeeg');
    $('scenarioLeeg').hidden = lijst.length > 0;
    $('scenarioInhoud').hidden = lijst.length === 0;
    if (!lijst.length) { $('vergelijkRijen').innerHTML = ''; return; }
    // De eerste rij is de huidige invoer: daar worden de opgeslagen scenario's mee vergeleken.
    var res = [huidigeKeuzes(t('demo.sc.huidig'))].concat(lijst).map(function (p) { return planUitkomst(p, rente, sk); });
    if (REEEL) {
      res = res.map(function (r) {
        var fp = reeelFactor(r.pensJaar), fa = reeelFactor(AOW_JAREN);
        return Object.assign({}, r, {
          pl: r.pl * fp,
          na: r.na * fa
        });
      });
    }
    var basis = $('basis').value;
    var ref = res[0].pl;

    $('vergelijkBasis').textContent = t('gemeen.' + basis) + ', ' + t(REEEL ? 'demo.sc.reeel' : 'gemeen.nominaal');
    $('vergelijkKop').innerHTML = '<tr><th>' + t('demo.sc.kolScenario') + '</th><th>' + t('demo.sc.kolVoor') + '</th><th>' + t('demo.sc.kolNa') + '</th><th>' + t('demo.sc.kolVerschil') + '</th></tr>';
    $('vergelijkRijen').innerHTML = res.map(function (r, i) {
      var verschil = r.pl - ref;
      var pijl = verschil > 0.5 ? '▲' : (verschil < -0.5 ? '▼' : '=');
      var teken = verschil > 0.5 ? '+' : (verschil < -0.5 ? '−' : '');
      var verschilTxt = i === 0 ? t('demo.sc.referentie') :
        '<strong>' + pijl + ' ' + teken + eur0.format(Math.abs(verschil)) + '</strong>' +
        (ref ? '<span class="sub-cel">' + teken + pctFmt.format(Math.abs(verschil) / ref * 100) + '%</span>' : '');
      var opties = [];
      if (r.t1 > 0) opties.push('TOPAOW ' + t('demo.perJaar', { bedrag: eur0.format(r.t1) }));
      if (r.t2 > 0) opties.push('TOPHL ' + Math.round(r.pctHL * 100) + '%');
      var p = i > 0 ? lijst[i - 1] : null;
      var datum = p && p.opgeslagen ? ' · ' + t('demo.sc.opgeslagenOp', { datum: datumNl(p.opgeslagen) }) : '';
      var knoppen = p ? '<button class="link-knop" type="button" data-plan="' + (i - 1) + '">' + t('demo.sc.laad') + '</button> ' +
        '<button class="link-knop" type="button" data-delete="' + (i - 1) + '">' + t('demo.sc.verwijder') + '</button>' : '';
      return '<tr' + (p ? '' : ' class="huidig"') + '>' +
        '<td><strong>' + esc(r.naam) + '</strong>' +
          '<span class="sub-cel">' + t('demo.sc.regel', { datum: r.pensLabel, kapitaal: eur0.format(r.kapitaal) }) + (opties.length ? ' · ' + opties.join(' · ') : '') + datum + '</span>' +
          knoppen + '</td>' +
        '<td>' + eur0.format(r.pl) + '</td>' +
        '<td>' + eur0.format(r.na) + '</td>' +
        '<td>' + verschilTxt + '</td>' +
        '</tr>';
    }).join('');
  }

  // Kies een mooie stapgrootte (1, 2 of 5 x een macht van 10) voor de Y-as.
  function nieuweStap(v) {
    var m = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var f = v / m;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * m;
  }

  // Schaal voor een as: nette stappen, startpunt op nul als dat kan.
  function schaal(waarden) {
    var lo = Math.min.apply(null, waarden), hi = Math.max.apply(null, waarden);
    var stap = nieuweStap(Math.max(hi - lo, 1) / 4);
    lo = Math.min(0, Math.floor(lo / stap) * stap);
    hi = Math.ceil(hi / stap) * stap;
    if (hi === lo) hi = lo + stap;
    return { lo: lo, hi: hi, stap: stap };
  }

  // Vermogensgrafiek. Standaard alleen het verwachte ouderdomspensioen per maand (rechter as).
  // Met de schakelaar erbij: de opbouw van het kapitaal (linker as). Pessimistisch en optimistisch volgen de keuze.
  function tekenVermogen(rows, startK, o) {
    var W = 720, H = 280, pl = 84, pr = 84, pt = 16, pb = 34;
    var n = rows.length;
    if (!n || (!o.toonKapitaal && !o.toonPensioen)) return '';
    function x(i) { return pl + (W - pl - pr) * i / Math.max(1, n - 1); }

    var pts = [], waardenK = [0], sk = null, sp = null;
    if (o.toonKapitaal) {
      // Elke onttrekking haalt een even groot deel uit het startkapitaal, de inleg en het overrendement.
      // Zo blijven alle stapels positief en tellen ze op tot het kapitaal na de onttrekking.
      var K = startK, P = 0, O = 0;   // startkapitaal, premie-inleg, overrendement
      pts = rows.map(function (r) {
        P += r.inleg; O += r.over;
        if (r.onttrokken > 0) {
          var tot = K + P + O;
          var f = tot > 0 ? Math.min(1, r.onttrokken / tot) : 0;
          K *= 1 - f; P *= 1 - f; O *= 1 - f;
        }
        var m = o.reeel ? r.defl : 1;
        return { base: K * m, top1: (K + P) * m, top2: (K + P + O) * m, dash: o.reeel ? (K + P + O) : r.reeel };
      });
      pts.forEach(function (p) { waardenK.push(p.base, p.top1, p.top2, p.dash); });
      o.kapLo.concat(o.kapHi).forEach(function (v) { waardenK.push(v); });
      sk = schaal(waardenK);
    }
    if (o.toonPensioen) sp = schaal([0].concat(o.pensioen, o.pensLo, o.pensHi));

    function yk(v) { return H - pb - (H - pt - pb) * (v - sk.lo) / (sk.hi - sk.lo); }
    function yp(v) { return H - pb - (H - pt - pb) * (v - sp.lo) / (sp.hi - sp.lo); }
    var yLinks = o.toonKapitaal ? yk : yp;
    var schaalLinks = o.toonKapitaal ? sk : sp;

    // Assen
    var grid = '';
    for (var tick = schaalLinks.lo; tick <= schaalLinks.hi + schaalLinks.stap / 2; tick += schaalLinks.stap) {
      var yy = yLinks(tick).toFixed(1);
      grid += '<line class="raster" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/>';
      grid += '<text class="as" x="' + (pl - 8) + '" y="' + (+yy + 4) + '" text-anchor="end">' + eur0.format(tick) + '</text>';
    }
    var titels = '';
    if (o.toonKapitaal && o.toonPensioen) {
      for (var u = sp.lo; u <= sp.hi + sp.stap / 2; u += sp.stap) {
        grid += '<text class="as" x="' + (W - pr + 8) + '" y="' + (yp(u) + 4).toFixed(1) + '" text-anchor="start">' + eur0.format(u) + '</text>';
      }
      titels = '<text class="as-titel" x="0" y="12" style="fill: var(--accent)">' + t('demo.kap.asKapitaal') + '</text>' +
        '<text class="as-titel" x="' + W + '" y="12" text-anchor="end" style="fill: var(--warm)">' + t('demo.kap.asPensioen') + '</text>';
    }

    var labels = '', vorige = -100;
    rows.forEach(function (r, i) {
      if ((r.maand.indexOf(I.maanden()[0] + ' ') === 0 || i === 0) && x(i) - vorige > 60 && x(i) < W - pr - 20) {
        labels += '<text class="as" x="' + x(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + r.maand.split(' ')[1] + '</text>';
        vorige = x(i);
      }
    });

    // Kapitaal: gestapelde banden
    var kap = '';
    if (o.toonKapitaal) {
      var band = function (lowKey, highKey) {
        var d = '';
        pts.forEach(function (p, i) { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + yk(p[highKey]).toFixed(1); });
        for (var i = n - 1; i >= 0; i--) d += 'L' + x(i).toFixed(1) + ',' + yk(pts[i][lowKey]).toFixed(1);
        return d + 'Z';
      };
      var vanaf0 = function (highKey) {
        var d = '';
        pts.forEach(function (p, i) { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + yk(p[highKey]).toFixed(1); });
        return d + 'L' + x(n - 1).toFixed(1) + ',' + yk(0).toFixed(1) + 'L' + x(0).toFixed(1) + ',' + yk(0).toFixed(1) + 'Z';
      };
      var overrendement = '';
      for (var j = 0; j < n - 1; j++) {
        var a1 = pts[j], b1 = pts[j + 1];
        var kleur = (a1.top2 - a1.top1 + b1.top2 - b1.top1) >= 0 ? 'var(--warm)' : 'var(--neg)';
        var dO = 'M' + x(j).toFixed(1) + ',' + yk(a1.top1).toFixed(1) + 'L' + x(j + 1).toFixed(1) + ',' + yk(b1.top1).toFixed(1) +
          'L' + x(j + 1).toFixed(1) + ',' + yk(b1.top2).toFixed(1) + 'L' + x(j).toFixed(1) + ',' + yk(a1.top2).toFixed(1) + 'Z';
        overrendement += '<path d="' + dO + '" fill="' + kleur + '" fill-opacity="0.65"/>';
      }
      var pR = '';
      pts.forEach(function (p, i) { pR += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + yk(p.dash).toFixed(1); });
      var lijnK = function (arr, kleurL, naam) {
        var d = '';
        arr.forEach(function (v, i) { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + yk(v).toFixed(1); });
        return '<path d="' + d + '" fill="none" stroke="' + kleurL + '" stroke-width="1.75" stroke-dasharray="2 3"><title>' + t('demo.kap.lijnTitel', { naam: naam }) + '</title></path>';
      };
      kap = '<path d="' + vanaf0('base') + '" fill="var(--muted)" fill-opacity="0.28"/>' +
        '<path d="' + band('base', 'top1') + '" fill="var(--accent)" fill-opacity="0.55"/>' +
        overrendement +
        '<path d="' + pR + '" fill="none" stroke="var(--fg)" stroke-width="1.75" stroke-dasharray="5 4"/>' +
        lijnK(o.kapLo, 'var(--neg)', t('demo.kap.pess')) + lijnK(o.kapHi, 'var(--accent)', t('demo.kap.opt'));
    }

    // Verwacht ouderdomspensioen per maand, met de bandbreedte
    var pens = '';
    if (o.toonPensioen) {
      var lijnP = function (arr, kleurL, stijl, naam, breed) {
        var d = '';
        arr.forEach(function (v, i) { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + yp(v).toFixed(1); });
        return '<path d="' + d + '" fill="none" stroke="' + kleurL + '" stroke-width="' + breed + '"' + (stijl ? ' stroke-dasharray="' + stijl + '"' : '') + '><title>' + naam + '</title></path>';
      };
      pens = lijnP(o.pensLo, 'var(--neg)', '2 3', t('demo.kap.pensPess'), 1.5) +
        lijnP(o.pensHi, 'var(--accent)', '2 3', t('demo.kap.pensOpt'), 1.5) +
        lijnP(o.pensioen, 'var(--warm)', '', t('demo.kap.pensVerwacht'), 2.5);
    }

    // Per maand een onzichtbare kolom met de cijfers als tooltip
    var kolom = (W - pl - pr) / Math.max(1, n - 1);
    var tips = rows.map(function (r, i) {
      var uitleg = r.maand + ':';
      if (o.toonPensioen) uitleg += ' ' + t('demo.kap.tipPensioen', { bedrag: eur0.format(o.pensioen[i]) });
      if (o.toonKapitaal) uitleg += (o.toonPensioen ? ', ' : ' ') + t('demo.kap.tipKapitaal', { bedrag: eur0.format(r.eind) });
      return '<rect x="' + (x(i) - kolom / 2).toFixed(1) + '" y="' + pt + '" width="' + kolom.toFixed(1) + '" height="' + (H - pt - pb) +
        '" fill="transparent"><title>' + uitleg + '</title></rect>';
    }).join('');

    return '<svg class="grafiek" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('demo.kap.aria') + '">' +
      grid + titels + labels + kap + pens + tips + '</svg>';
  }

  // Y-as van het uitkeringspatroon: 15% ruimte boven de hoogste staaf, op een nette stap met hooguit 5 stappen.
  function uitkeringsAs(max) {
    var doel = max * 1.15;
    var m = Math.pow(10, Math.floor(Math.log(doel) / Math.LN10));
    var fracties = [0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10];
    for (var k = 0; k < fracties.length; k++) {
      var stap = fracties[k] * m;
      var top = Math.ceil(doel / stap) * stap;
      if (top / stap <= 5) return { top: top, stap: stap };
    }
    return { top: Math.ceil(doel / m) * m, stap: m };
  }

  // Staafdiagram: per leeftijdsjaar het gemiddelde bedrag per maand (nominaal, en reëel als die schuif aanstaat).
  init();
})();
</script>
<div class="wkp-back" id="wkpBack" hidden>
  <div class="wkp-dialog" id="wkpDialog" role="dialog" aria-modal="true" aria-labelledby="wkpKop" tabindex="-1">
    <div class="wkp-teller" id="wkpTeller"></div>
    <h2 class="wkp-kop" id="wkpKop"></h2>
    <div class="wkp-voortgang" id="wkpVoortgang" aria-hidden="true"></div>
    <div class="wkp-tekst" id="wkpTekst"></div>
    <label class="wkp-check" id="wkpVinkWrap"><input type="checkbox" id="wkpVink"> <span data-i18n="demo.wkp.gelezen"></span></label>
    <div class="wkp-knoppen" id="wkpKnoppen"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'pensioenplanner.welkom.v1';
  var AANTAL = 5;
  var t = window.I18N.t;
  // Teksten uit de taalbestanden (demo.wkp.*): een inleiding en vijf punten met elk twee alinea's.
  function intro() { return { kop: t('demo.wkp.introKop'), alinea: [t('demo.wkp.intro')] }; }
  function punt(i) {
    var n = 'demo.wkp.p' + (i + 1);
    return { kop: t(n + '.kop'), alinea: [t(n + '.a1'), t(n + '.a2')] };
  }

  var s = lees();
  var huidig = 0;
  var opIntro = false;   // welk scherm open staat, om het bij een taalwissel opnieuw te tekenen
  var vorigeFocus = null;

  function $(id) { return document.getElementById(id); }
  function lees() {
    try {
      var r = window.localStorage.getItem(KEY);
      var o = r ? JSON.parse(r) : null;
      if (o && o.gelezen && o.gelezen.length === AANTAL) return o;
    } catch (e) {}
    return { keuze: null, gelezen: [false, false, false, false, false] };
  }
  function bewaar() {
    try { window.localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  function maak(tag, cls, tekst) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (tekst !== undefined) n.textContent = tekst;
    return n;
  }
  function knop(tekst, extra, fn) {
    var b = maak("button", "wkp-btn" + (extra ? " " + extra : ""), tekst);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }
  function eersteOnbekende() {
    for (var i = 0; i < AANTAL; i++) { if (!s.gelezen[i]) return i; }
    return 0;
  }
  function vulTekst(alinea) {
    var w = $("wkpTekst");
    w.textContent = "";
    alinea.forEach(function (a) { w.appendChild(maak("p", "", a)); });
  }
  function balken(i) {
    var v = $("wkpVoortgang");
    v.textContent = "";
    for (var j = 0; j < AANTAL; j++) {
      v.appendChild(maak("span", (s.gelezen[j] ? "klaar" : "") + (j === i ? " huidig" : "")));
    }
  }
  function openen() {
    if (!$("wkpBack").hidden) return;
    vorigeFocus = document.activeElement;
    $("wkpBack").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function sluit() {
    $("wkpBack").hidden = true;
    document.body.style.overflow = "";
    if (vorigeFocus && vorigeFocus.focus) vorigeFocus.focus();
  }

  function toonIntro() {
    opIntro = true;
    var p = intro();
    $("wkpTeller").textContent = t('demo.wkp.welkom');
    $("wkpKop").textContent = p.kop;
    vulTekst(p.alinea);
    $("wkpVoortgang").hidden = true;
    $("wkpVinkWrap").hidden = true;
    var k = $("wkpKnoppen");
    k.textContent = "";
    k.appendChild(knop(t('demo.wkp.nee'), "tweede", function () {
      s.keuze = "nee"; bewaar(); sluit();
    }));
    k.appendChild(knop(t('demo.wkp.ja'), "", function () {
      s.keuze = "ja"; bewaar(); toonPunt(eersteOnbekende());
    }));
    k.firstChild.focus();
  }

  function toonPunt(i) {
    huidig = i;
    opIntro = false;
    var p = punt(i);
    var laatste = i === AANTAL - 1;
    $("wkpTeller").textContent = t('demo.wkp.teller', { n: i + 1, totaal: AANTAL });
    $("wkpKop").textContent = p.kop;
    vulTekst(p.alinea);
    $("wkpVoortgang").hidden = false;
    balken(i);
    $("wkpVinkWrap").hidden = false;
    $("wkpVink").checked = !!s.gelezen[i];

    var k = $("wkpKnoppen");
    k.textContent = "";
    if (i > 0) k.appendChild(knop(t('demo.wkp.vorige'), "tweede", function () { toonPunt(i - 1); }));
    k.appendChild(knop(t('demo.wkp.sluiten'), "tweede", function () { sluit(); }));
    var volg = knop(t(laatste ? 'demo.wkp.naarPlanner' : 'demo.wkp.volgende'), "", function () {
      if (!s.gelezen[huidig]) return;
      if (laatste) { sluit(); } else { toonPunt(huidig + 1); }
    });
    volg.id = "wkpVolgende";
    volg.disabled = !s.gelezen[i];
    k.appendChild(volg);
    $("wkpVink").focus();
  }

  $("wkpVink").addEventListener("change", function () {
    s.gelezen[huidig] = this.checked;
    bewaar();
    balken(huidig);
    var vol = $("wkpVolgende");
    if (vol) vol.disabled = !this.checked;
  });

  function start() {
    if (s.keuze === "nee") return;
    if (s.keuze === "ja" && s.gelezen.every(Boolean)) return;
    openen();
    if (s.keuze === "ja") { toonPunt(eersteOnbekende()); } else { toonIntro(); }
  }

  function opnieuw() {
    openen();
