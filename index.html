<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title data-i18n="demo.titel"></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f2ec;
    --surface: #fffdf8;
    --fg: #1c2421;
    --muted: #5d6661;
    --line: #d9d5ca;
    --accent: #1f5c5a;
    --accent-soft: #e2eeec;
    --warm: #b3622f;
    --warn-bg: #fbeedd;
    --warn-fg: #7a3e10;
    --neg: #b3261e;
    --topaow: #6b4f9e; --tophl: #3f8f4a; --plan-d: #3a6ea5;
    --panel: #1f5c5a;
    --panel-fg: #f4f8f7;
    --panel-sub: #bcd6d3;
    --panel-inner: #2a6d6a;
    --invoer-bg: #e9e4d6;
    --uitvoer-bg: #e1eeeb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131917; --surface: #1b2321; --fg: #eef1ee; --muted: #a3ada8; --line: #33403c;
      --accent: #7fc3bf; --accent-soft: #213330; --warm: #e8a077; --warn-bg: #3a2a1c; --warn-fg: #f3cfb0; --neg: #ff8a80;
      --topaow: #b9a2e8; --tophl: #8fd19a; --plan-d: #8ab4e8;
      --panel: #24504e; --panel-fg: #eef6f5; --panel-sub: #a9cbc7; --panel-inner: #2e6360;
      --invoer-bg: #17201e; --uitvoer-bg: #14201e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131917; --surface: #1b2321; --fg: #eef1ee; --muted: #a3ada8; --line: #33403c;
    --accent: #7fc3bf; --accent-soft: #213330; --warm: #e8a077; --warn-bg: #3a2a1c; --warn-fg: #f3cfb0; --neg: #ff8a80;
      --topaow: #b9a2e8; --tophl: #8fd19a; --plan-d: #8ab4e8;
    --panel: #24504e; --panel-fg: #eef6f5; --panel-sub: #a9cbc7; --panel-inner: #2e6360;
    --invoer-bg: #17201e; --uitvoer-bg: #14201e;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; min-width: 0; }
  h1, h2, h3 { font-family: "Newsreader", Georgia, serif; font-weight: 600; margin: 0; text-wrap: balance; }
  h1 { font-size: 34px; line-height: 1.15; }
  h2 { font-size: 22px; line-height: 1.2; }
  h3 { font-size: 18px; line-height: 1.2; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lead { margin: 10px 0 0; color: var(--muted); max-width: 62ch; }
  /* Rustige rij met nevenpagina's in de header */
  .kop-links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; margin: 14px 0 0; font-size: 13px; }
  .kop-links a, .kop-links button {
    font: inherit; color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer;
    text-decoration: none; text-underline-offset: 3px;
  }
  .kop-links > * + *::before { content: "\00b7"; color: var(--muted); opacity: .6; margin: 0 10px; display: inline-block; }
  .kop-links a:hover, .kop-links button:hover { color: var(--accent); text-decoration: underline; }
  .kop-links a:focus-visible, .kop-links button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .paneel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
  .muted { color: var(--muted); font-size: 14px; }

  /* Wizard */
  .opzet { display: grid; gap: 20px; min-width: 0; }
  @media (min-width: 880px) {
    .opzet { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); align-items: start; }
  }
  .stap { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
  .stap + .stap { margin-top: 10px; }
  .stap-kop {
    width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center;
    background: transparent; border: 0; color: var(--fg); font: inherit; text-align: left; padding: 14px 16px; cursor: pointer; border-radius: 12px;
  }
  .stap-kop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nummer {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--surface);
    display: grid; place-items: center; font-size: 13px; font-weight: 600;
  }
  .stap-titel { font-weight: 600; }
  .stap-keuze { display: block; font-weight: 400; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .pijl { color: var(--muted); transition: transform .2s; }
  .stap-kop[aria-expanded="true"] .pijl { transform: rotate(180deg); }
  .stap-body { padding: 0 16px 16px 56px; display: grid; gap: 12px; }
  .stap-body[hidden] { display: none; }
  .keuze { display: grid; gap: 8px; }
  label.optie {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; background: var(--bg);
  }
  label.optie:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  label.optie input { accent-color: var(--accent); margin: 3px 0 0; }
  label.optie small { display: block; color: var(--muted); font-size: 13px; }
  .sub { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; }
  .sub[hidden] { display: none; }
  .rij { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select, input[type="month"] {
    font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  select:focus-visible, input:focus-visible, label.optie:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .vraag {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; flex: none;
  }
  .uitleg { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 0; }
  .uitleg[hidden] { display: none; }
  .melding { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 10px 12px; margin: 0; font-size: 14px; }
  .melding[hidden] { display: none; }
  .link-knop { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }

  /* Invoer (links) en uitvoer (rechts/onder) krijgen elk een eigen achtergrond */
  .invoer { background: var(--invoer-bg); border-radius: 14px; padding: 14px; min-width: 0; }
  .invoer .stap { background: var(--surface); }
  .invoer label.optie { background: var(--surface); }
  .invoer select, .invoer input[type="number"] { background: var(--surface); }
  .paneel.uitvoer { background: var(--uitvoer-bg); }
  .paneel.uitvoer table.maand thead th { background: var(--uitvoer-bg); }

  /* Resultaatpaneel */
  .resultaat { background: var(--panel); color: var(--panel-fg); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
  .resultaat .kop { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .resultaat select { background: var(--panel-inner); color: var(--panel-fg); border-color: var(--panel-sub); }
  .resultaat .blok { background: var(--panel-inner); border-radius: 12px; padding: 16px; display: grid; gap: 6px; }
  .resultaat .label { font-size: 13px; color: var(--panel-sub); }
  .resultaat .bedrag { font-family: "Newsreader", Georgia, serif; font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .resultaat .sub-tekst { font-size: 14px; color: var(--panel-sub); font-variant-numeric: tabular-nums; }
  .resultaat .info { background: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .schakel { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel-inner); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .schakel input { accent-color: var(--accent); width: 18px; height: 18px; }
  .resultaat .knop {
    font: inherit; font-weight: 600; background: transparent; color: var(--panel-fg); border: 1px solid var(--panel-sub); border-radius: 10px; padding: 10px 14px; cursor: pointer; justify-self: start;
  }

  /* Overige secties */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .kpi .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .kpi .waarde { font-family: "Newsreader", Georgia, serif; font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .sub { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .grafiek { width: 100%; height: auto; display: block; }
  .grafiek .as { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .grafiek .mk { fill: var(--fg); font-weight: 600; }
  .grafiek .raster { stroke: var(--line); stroke-width: 1; }
  .legenda { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .legenda span::before { content: ""; display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  .legenda .staaf::before { height: 10px; width: 12px; border-radius: 2px; }
  .legenda .stippel::before { background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 8px); }
  .tabel-wrap { overflow: auto; max-height: 460px; border: 1px solid var(--line); border-radius: 10px; }
  table.maand { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.maand th, table.maand td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  table.maand th:first-child, table.maand td:first-child, table.maand th:nth-child(2), table.maand td:nth-child(2) { text-align: left; }
  table.maand thead th { position: sticky; top: 0; background: var(--surface); font-weight: 600; z-index: 1; border-bottom: 1px solid var(--muted); }
  table.maand tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--accent-soft) 35%, transparent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  table.maand tbody tr.wijz td { background: var(--accent-soft); font-weight: 600; }
  .voet { font-size: 13px; color: var(--muted); }
  .voet p { margin: 0 0 6px; }

  .seg-groep { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg { font: inherit; font-size: 14px; background: var(--bg); color: var(--fg); border: 0; padding: 8px 14px; cursor: pointer; }
  .seg + .seg { border-left: 1px solid var(--line); }
  .seg.actief { background: var(--accent); color: var(--surface); font-weight: 600; }
  .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  label.optie svg.mini { flex: none; width: 56px; height: 28px; margin-top: 2px; color: var(--accent); }
  .legenda .punt::before { background: repeating-linear-gradient(90deg, var(--c) 0 2px, transparent 2px 5px); }
  .resultaat .seg-groep { border-color: var(--panel-sub); }
  .resultaat .seg { background: var(--panel-inner); color: var(--panel-fg); }
  .resultaat .seg + .seg { border-left-color: var(--panel-sub); }
  .resultaat .seg.actief { background: var(--panel-fg); color: var(--panel); }
  .resultaat #rPartner { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-sub); display: grid; gap: 4px; }
  .resultaat .bedrag-klein { font-family: "Newsreader", Georgia, serif; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .resultaat .uitsplitsing { font-size: 14px; color: var(--panel-sub); display: grid; gap: 2px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .resultaat .uitsplitsing strong { color: var(--panel-fg); }
  .resultaat .netto-toelichting { font-size: 12px; color: var(--panel-sub); margin: 6px 0 0; }
  .grafiek .zone { font-weight: 600; fill: var(--muted); }
  .grafiek .as-link { fill: var(--accent); text-decoration: underline; font-weight: 600; }
  .grafiek-link { margin: 10px 0 0; font-size: 14px; }
  #vergelijk .link-knop { margin-top: 8px; justify-self: start; }
  @media (max-width: 600px) {
    #deelnemerKeuze { min-width: 0 !important; width: 100%; }
    #startkapitaal { width: 100% !important; }
    .resultaat .bedrag { font-size: 30px; }
  }
  .as-titel { font-size: 12px; font-weight: 600; }
  .legenda[hidden] { display: none; }
  table.vergelijk { table-layout: fixed; }
  table.vergelijk th, table.vergelijk td { white-space: normal; vertical-align: top; padding: 8px 6px; }
  table.vergelijk th:first-child, table.vergelijk td:first-child { width: 44%; }
  table.vergelijk th:not(:first-child), table.vergelijk td:not(:first-child) { width: 18.6%; }
  table.vergelijk .sub-cel { display: block; color: var(--muted); font-size: 12px; margin: 3px 0 6px; }
  table.vergelijk td strong { white-space: nowrap; }
  details.plannen > summary { font-family: "Newsreader", Georgia, serif; font-size: 24px; font-weight: 600; cursor: pointer; list-style: none; }
  details.plannen > summary::-webkit-details-marker { display: none; }
  details.plannen > summary .muted { font-family: inherit; font-size: 14px; font-weight: 400; }
  table.vergelijk .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  label.weergave { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 14px; cursor: pointer; }
  label.weergave input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  details.uitleg { margin-top: 12px; }
  details.uitleg summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  details.uitleg p { margin: 10px 0 0; }
  /* Welkomst-pop-ups */
  .wkp-open { font: inherit; font-weight: 600; font-size: 14px; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .wkp-open:hover { background: var(--accent-soft, #e2eeec); }
  .wkp-open:focus-visible, .wkp-btn:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
  .wkp-back { position: fixed; inset: 0; background: rgba(20, 26, 24, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .wkp-dialog { background: var(--surface); color: var(--fg); border-radius: 10px; max-width: 560px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; padding: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); }
  .wkp-dialog:focus { outline: none; }
  .wkp-teller { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .wkp-kop { font-family: "Newsreader", Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.2; margin: 6px 0 12px; text-wrap: balance; }
  .wkp-tekst p { margin: 0 0 10px; }
  .wkp-voortgang { display: flex; gap: 6px; margin: 16px 0; }
  .wkp-voortgang span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .wkp-voortgang span.klaar { background: var(--accent); }
  .wkp-voortgang span.huidig { box-shadow: inset 0 0 0 2px var(--warm); }
  .wkp-check { display: flex; gap: 10px; align-items: center; margin: 8px 0 0; font-weight: 600; cursor: pointer; }
  .wkp-check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .wkp-knoppen { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .wkp-btn { font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
  .wkp-btn.tweede { background: transparent; color: var(--accent); }
  .wkp-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .wkp-voet { margin-top: 12px; }
  [hidden] { display: none !important; }
  /* Design C: keuzes links, grafiek en uitkomst rechts */
  .grafiek-kop { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; justify-content: space-between; }
  .grafiek-kop h2 { margin-right: auto; }
  .grafiek-kop .mobiel { display: none; }
  .grafiekpaneel { min-width: 0; }
  @media (min-width: 880px) {
    .rechts { position: sticky; top: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; gap: 16px; min-height: 0; min-width: 0; }
    .rechts > .grafiekpaneel { flex: none; overflow: hidden; }
    .rechts > .resultaat { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  }
  @media (max-width: 879px) {
    .rechts { display: contents; }
    .grafiekpaneel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 52vh; overflow-y: auto; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.18); border-bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
    .grafiekpaneel .grafiek-kop .mobiel { display: inline-flex; }
    .grafiekpaneel.ingeklapt { max-height: none; overflow: hidden; }
    .grafiekpaneel.ingeklapt > :not(.grafiek-kop) { display: none; }
    body.met-sheet { padding-bottom: 52vh; }
    body.met-sheet.sheet-ingeklapt { padding-bottom: 96px; }
  }

  /* Desktop: grafiek bovenaan, resultaat horizontaal eronder (niet meer sticky) */
  @media (min-width: 880px) {
    .rechts { position: static; height: auto; min-height: 0; }
    .rechts > .resultaat { flex: none; overflow: visible; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; }
    .rechts > .resultaat > .blok { flex: 1 1 230px; }
    .rechts > .resultaat > .kop,
    .rechts > .resultaat > .info,
    .rechts > .resultaat > .schakel,
    .rechts > .resultaat > .knop { flex-basis: 100%; }
    .rechts > .resultaat > #rPartnerBlok { flex-basis: 100%; }
    .rechts > .resultaat > #rInfo:not(:has(#rDeel:not(:empty))) { display: none; }
    .rechts > .resultaat .bedrag { font-size: 26px; }
    .rechts > .resultaat .blok { padding: 14px; }
  }
  .bewaar-plan { display: grid; gap: 8px; margin-top: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .bewaar-plan h3 { font-size: 17px; }
  .bewaar-plan .link-knop { font-size: inherit; }
  table.vergelijk tr.huidig td { background: var(--accent-soft); }
  .bewaar-plan input[type="text"] { flex: 1 1 220px; min-width: 0; font: inherit; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .grafiek-keuze { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 14px; cursor: pointer; }
  .grafiek-keuze input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
</style>

<main class="wrap">

  <header>
    <p class="eyebrow" data-i18n="demo.eyebrow"></p>
    <h1 data-i18n="demo.h1"></h1>
    <p class="lead" data-i18n="demo.lead"></p>
    <nav class="kop-links" data-i18n-attr="aria-label:demo.nav">
      <a id="potLink" href="bij-en-afschrijvingen.html" data-i18n-attr="title:demo.navPotTitel" data-i18n="demo.navPot"></a>
      <a href="varianten/index.html" data-i18n-attr="title:demo.navVariantenTitel" data-i18n="demo.navVarianten"></a>
      <a href="testspecialisten.html" data-i18n="demo.navTest"></a>
      <button type="button" data-wkp-open data-i18n="demo.popupsOpnieuw"></button>
      <span data-taalknop></span>
    </nav>
  </header>

  <div class="paneel" style="padding: 16px 20px; display: grid; gap: 12px">
    <div class="rij" style="justify-content: space-between; gap: 12px">
      <label for="deelnemerKeuze" style="font-weight: 600" data-i18n="demo.deelnemer"></label>
